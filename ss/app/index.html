<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="color-scheme" content="dark light">
<title>Skybox Studio — HDRI / Skybox Generator</title>
<meta name="description" content="Skybox Studio — professional real-time HDRI and cube map generator with procedural sky, aurora, stars, clouds.">
<meta name="author" content="Overpowerfulered">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><path d='M20 78 Q50 48 80 78 Z' fill='white'/></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:#0a0a12;color:#fff;position:fixed;inset:0;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s;line-height:1.5}
body.theme-light{background:#e8ecf2;color:#1a1c26}
:root{
  --grid-pad:10px;--grid-gap:8px;--tile-base:64px;--header-h:46px;
  --bottom-btn:calc(var(--tile-base) * 0.7);
  --top-anchor:calc(env(safe-area-inset-top,0px) + var(--grid-pad) + var(--header-h) + var(--grid-gap));
  --bottom-anchor:calc(env(safe-area-inset-bottom,0px) + var(--grid-pad) + var(--bottom-btn) + var(--grid-gap));
  --pos-block-w:calc(var(--tile-base) * 3.6);
  --ui-fs-tiny:9px;--ui-fs-small:10px;--ui-fs-base:13px;--ui-fs-large:16px;
  --icon-size-sm:15px;--icon-size-md:18px;--icon-size-lg:19px;
  --ui-accent:#6366f1;--ui-accent-hover:#4f46e5;
  --ui-success:#10b981;
  --ui-strip:rgba(20,20,28,.62);--ui-strip-border:rgba(255,255,255,.08);
  --ui-strip-shadow:0 4px 14px rgba(0,0,0,.3);
  --ui-icon-color:rgba(255,255,255,.78);--ui-icon-color-hover:#fff;
  --ui-label-color:rgba(255,255,255,.62);--ui-text-on-strip:#fff;
  --ui-track:#3a3a4a;--ui-divider:rgba(255,255,255,.08);
  --pop-bg:rgba(22,22,30,.97);--pop-border:rgba(255,255,255,.1);
  --pop-text:#fff;--pop-title-color:rgba(255,255,255,.62);
  --pop-accent:#818cf8;--pop-accent-soft:#a5b4fc;
  --pop-tile-bg:rgba(255,255,255,.06);--pop-tile-bg-hover:rgba(255,255,255,.14);
  --pop-tile-active:rgba(99,102,241,.28);--pop-tile-text:rgba(255,255,255,.78);
  --pop-track:rgba(255,255,255,.15);--pop-thumb:#fff;--pop-btn-bg:rgba(255,255,255,.08);
  --toast-bg:rgba(30,30,40,.96);--toast-border:rgba(255,255,255,.1);--toast-text:#fff;
  --gizmo-ring:rgba(255,255,255,.08);
  --skeleton-base:rgba(255,255,255,.06);--skeleton-shine:rgba(255,255,255,.14);
  --modal-cancel-bg:rgba(255,255,255,.08);--modal-cancel-color:#eef0f6;--modal-cancel-hover:rgba(255,255,255,.16);
  --active-highlight:rgba(99,102,241,.16);
}
body.theme-light{
  --ui-strip:rgba(255,255,255,.82);--ui-strip-border:rgba(0,0,0,.08);
  --ui-strip-shadow:0 4px 16px rgba(0,0,0,.12);
  --ui-icon-color:rgba(30,32,44,.72);--ui-icon-color-hover:#1a1c26;
  --ui-label-color:rgba(30,32,44,.62);--ui-text-on-strip:#1a1c26;
  --ui-track:#c9d0db;--ui-divider:rgba(0,0,0,.07);
  --pop-bg:rgba(250,251,254,.98);--pop-border:rgba(0,0,0,.08);
  --pop-text:#1a1c26;--pop-title-color:rgba(30,32,44,.62);
  --pop-accent:#4f46e5;--pop-accent-soft:#4338ca;
  --pop-tile-bg:rgba(0,0,0,.045);--pop-tile-bg-hover:rgba(0,0,0,.08);
  --pop-tile-active:rgba(99,102,241,.16);--pop-tile-text:rgba(30,32,44,.75);
  --pop-track:rgba(0,0,0,.12);--pop-thumb:#1a1c26;--pop-btn-bg:rgba(0,0,0,.05);
  --toast-bg:rgba(250,251,254,.98);--toast-border:rgba(0,0,0,.08);--toast-text:#1a1c26;
  --gizmo-ring:rgba(0,0,0,.06);
  --skeleton-base:rgba(0,0,0,.06);--skeleton-shine:rgba(0,0,0,.12);
  --modal-cancel-bg:rgba(0,0,0,.06);--modal-cancel-color:#1a1c26;--modal-cancel-hover:rgba(0,0,0,.12);
}
/* Дополнительно: если открыт светлый пресет неба, но тёмная тема UI —
   контрастные элементы UI подстраиваются (иконки, цифры, текст). */
body.dark-preset {
  --ui-icon-color: rgba(30,32,44,.72);
  --ui-icon-color-hover: #1a1c26;
  --ui-label-color: rgba(30,32,44,.62);
  --ui-text-on-strip: #1a1c26;
  --ui-strip: rgba(255,255,255,.82);
  --ui-strip-border: rgba(0,0,0,.08);
  --ui-track: #c9d0db;
  --ui-divider: rgba(0,0,0,.07);
}
body.theme-light.dark-preset {
  --ui-icon-color: rgba(255,255,255,.78);
  --ui-icon-color-hover: #fff;
  --ui-label-color: rgba(255,255,255,.62);
  --ui-text-on-strip: #fff;
  --ui-strip: rgba(20,20,28,.62);
  --ui-strip-border: rgba(255,255,255,.08);
  --ui-track: #3a3a4a;
  --ui-divider: rgba(255,255,255,.08);
}
@media (min-width:900px){:root{--grid-pad:16px;--grid-gap:12px;--tile-base:88px;--header-h:64px;--ui-fs-tiny:12px;--ui-fs-small:13px;--ui-fs-base:15px;--ui-fs-large:19px;--icon-size-sm:20px;--icon-size-md:22px;--icon-size-lg:24px}}
@media (min-width:1400px){:root{--grid-pad:20px;--grid-gap:16px;--tile-base:104px;--header-h:72px;--ui-fs-tiny:14px;--ui-fs-small:15px;--ui-fs-base:17px;--ui-fs-large:21px;--icon-size-sm:23px;--icon-size-md:26px;--icon-size-lg:28px}}
body.kb-open{--grid-pad:8px;--tile-base:52px;--header-h:40px;--ui-fs-tiny:8px;--ui-fs-small:9px;--ui-fs-base:11px;--ui-fs-large:13px;--icon-size-sm:13px;--icon-size-md:15px;--icon-size-lg:16px}

#viewport{position:absolute;inset:0;touch-action:none;cursor:grab}
#viewport:active{cursor:grabbing}
#viewport canvas{display:block;width:100%;height:100%}
#viewport.dragover::after{content:'';position:absolute;inset:12px;border:2px dashed #818cf8;border-radius:24px;background:rgba(99,102,241,.12);pointer-events:none;z-index:5}

@keyframes skeletonShine{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{background:linear-gradient(90deg,var(--skeleton-base) 25%,var(--skeleton-shine) 50%,var(--skeleton-base) 75%);background-size:200% 100%;animation:skeletonShine 1.4s ease-in-out infinite;border-radius:inherit;color:transparent!important;pointer-events:none}

.top-bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + var(--grid-pad));left:var(--grid-pad);right:var(--grid-pad);height:var(--header-h);display:flex;align-items:center;justify-content:space-between;background:var(--ui-strip);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-radius:calc(var(--header-h) / 2);padding:6px;box-shadow:var(--ui-strip-shadow);border:1px solid var(--ui-strip-border);z-index:20;color:var(--ui-text-on-strip)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 12px 2px 4px;min-width:0}
.brand-logo{width:calc(var(--header-h) - 16px);height:calc(var(--header-h) - 16px);border-radius:calc((var(--header-h) - 16px) / 3);background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:var(--ui-fs-large);color:#fff}
.brand-text{min-width:0;overflow:hidden}
.brand-title-row{display:flex;align-items:center;gap:8px;line-height:1.15;min-width:0}
.brand-title{font-size:var(--ui-fs-base);font-weight:700;letter-spacing:-.2px;color:var(--ui-text-on-strip);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-ver{font-size:var(--ui-fs-tiny);font-weight:600;color:var(--ui-accent);background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.3);padding:2px 7px;border-radius:7px;font-family:'SF Mono',ui-monospace,monospace;white-space:nowrap;flex-shrink:0}
.brand-sub{font-size:var(--ui-fs-small);font-weight:500;color:var(--ui-label-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;margin-top:2px}
.brand-sub a{color:var(--ui-label-color);text-decoration:none}
.brand-sub a:hover{color:var(--ui-accent)}
.help-btn-top{width:calc(var(--header-h) - 16px);height:calc(var(--header-h) - 16px);border-radius:50%;border:none;background:transparent;color:var(--ui-icon-color);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--icon-size-md);transition:background .15s,color .15s;flex-shrink:0;padding:0}
.help-btn-top:hover{color:var(--ui-icon-color-hover);background:var(--active-highlight)}

.left-top-group{position:absolute;top:var(--top-anchor);left:var(--grid-pad);z-index:18;display:flex;flex-direction:column;pointer-events:none;width:var(--pos-block-w);max-width:calc(50vw - var(--grid-pad) * 2)}
.left-top-group>*{pointer-events:auto}
.pos-header{display:flex;align-items:center;gap:6px;padding:0 4px 6px;min-height:14px;height:20px}
.pos-label{font-size:var(--ui-fs-tiny);font-weight:700;color:var(--ui-label-color);text-transform:uppercase;letter-spacing:.8px}
.pos-sep{font-size:var(--ui-fs-tiny);color:var(--ui-label-color);opacity:.6;display:none}
.pos-sep.visible{display:inline}
.pos-reset-btn{border:none;background:transparent;color:var(--ui-accent);font-family:inherit;font-size:var(--ui-fs-tiny);font-weight:700;padding:0;cursor:pointer;letter-spacing:.5px;line-height:1;text-transform:uppercase;display:none}
.pos-reset-btn.visible{display:inline}
.pos-unified{display:flex;align-items:stretch;gap:8px;width:100%;height:var(--tile-base);min-width:0}
.gizmo{width:calc(var(--tile-base) - 10px);height:calc(var(--tile-base) - 10px);cursor:pointer;touch-action:none;flex-shrink:0;border-radius:11px;opacity:.95;background:var(--gizmo-ring);position:relative}
.gizmo canvas{display:block;width:100%;height:100%;border-radius:11px;background:transparent}
.pos-divider{width:1px;background:var(--ui-strip-border);align-self:stretch;flex-shrink:0;margin:2px 0;opacity:.6}
.coords-block{display:flex;flex-direction:column;gap:1px;padding:3px 0;justify-content:center;flex:1 1 auto;min-width:0;overflow:hidden}
.coord-row{display:flex;align-items:center;gap:2px;height:calc((var(--tile-base) - 16px) / 3);min-width:0;overflow:hidden}
.coord-lbl{font-size:var(--ui-fs-small);font-weight:700;font-family:'SF Mono',ui-monospace,monospace;width:auto;text-align:center;flex-shrink:0;display:inline-flex;align-items:center}
.coord-lbl.x{color:#ff5a5a}.coord-lbl.y{color:#33cc33}.coord-lbl.z{color:#5588ff}
.coord-lbl .coord-colon{color:var(--ui-label-color);opacity:.65;font-weight:500;margin-left:1px}
.coord-input{flex:1 1 auto;min-width:0;width:auto;background:transparent;border:none;color:var(--ui-text-on-strip);font-family:'SF Mono',ui-monospace,monospace;font-size:var(--ui-fs-small);font-weight:600;padding:0 2px 0 4px;outline:none;text-align:left;-moz-appearance:textfield;line-height:1;height:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.coord-input::-webkit-outer-spin-button,.coord-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.layers-container{position:absolute;top:var(--top-anchor);right:var(--grid-pad);z-index:18;display:flex;flex-direction:column;pointer-events:none;align-items:flex-end;max-width:calc(100vw - var(--grid-pad) * 2 - var(--pos-block-w) - var(--grid-gap) * 4)}
.layers-container>*{pointer-events:auto}
.layers-label{font-size:var(--ui-fs-tiny);font-weight:700;color:var(--ui-label-color);text-transform:uppercase;letter-spacing:.8px;padding:0 4px 6px;display:flex;align-items:center;justify-content:flex-end;min-height:14px;width:100%;height:20px}
.layers-tiles{display:flex;gap:6px;justify-content:flex-end;align-items:stretch;height:var(--tile-base);flex-wrap:nowrap}
.layer-tile{width:var(--tile-base);height:var(--tile-base);background:var(--ui-strip);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-radius:16px;box-shadow:var(--ui-strip-shadow);border:1px solid var(--ui-strip-border);display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;color:var(--ui-text-on-strip);flex-shrink:0;overflow:hidden;touch-action:manipulation;outline:none;transition:opacity .15s,transform .15s}
.layer-tile:hover{transform:translateY(-1px)}
.layer-tile.off{opacity:.55}
.layer-tile.off .layer-preview{filter:grayscale(1)}
.layer-preview{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(128,128,128,.5);font-size:var(--icon-size-md);pointer-events:none;background:rgba(0,0,0,.15)}
.layer-preview img{width:100%;height:100%;display:block;object-fit:cover}
.layer-name{position:absolute;left:0;right:0;bottom:0;font-size:var(--ui-fs-tiny);font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.3px;text-align:center;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 3px;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0));pointer-events:none;z-index:2}
.layer-toggle{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;cursor:pointer;border:1px solid rgba(255,255,255,.15);z-index:3}
.layer-tile.off .layer-toggle{background:rgba(99,102,241,.9)}

.center-actions-row{position:absolute;top:calc(var(--top-anchor) + 20px + var(--tile-base) + var(--grid-gap) + 8px);left:var(--grid-pad);right:var(--grid-pad);z-index:18;height:var(--bottom-btn);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;pointer-events:none}
.center-actions-row>*{pointer-events:auto}
.left-actions-group,.right-actions-group{display:flex;align-items:center;gap:2px}
.left-actions-group{justify-self:start}
.right-actions-group{justify-self:end}
.left-actions-group .tc-btn,.right-actions-group .tc-btn{width:var(--bottom-btn);height:var(--bottom-btn);border-radius:50%;border:none;background:transparent;color:var(--ui-icon-color);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--icon-size-md);transition:background .15s,color .15s,opacity .15s;flex-shrink:0;padding:0}
.left-actions-group .tc-btn:hover:not(:disabled),.right-actions-group .tc-btn:hover:not(:disabled){color:var(--ui-icon-color-hover);background:var(--active-highlight)}
.left-actions-group .tc-btn:disabled,.right-actions-group .tc-btn:disabled{opacity:.4;cursor:not-allowed}
.left-actions-group .tc-btn.open,.right-actions-group .tc-btn.open{color:var(--ui-accent);background:var(--active-highlight)}
.left-actions-group .tc-sep,.right-actions-group .tc-sep{width:1px;height:calc(var(--bottom-btn) * .5);background:var(--ui-strip-border);margin:0 2px;flex-shrink:0}
.fps-center{justify-self:center;font-size:var(--ui-fs-tiny);font-weight:600;font-family:'SF Mono',ui-monospace,monospace;letter-spacing:.5px;white-space:nowrap;padding:4px 8px;color:var(--ui-text-on-strip);min-width:60px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5)}
body.theme-light .fps-center{text-shadow:0 1px 2px rgba(255,255,255,.7)}

.left-stack{position:absolute;top:50%;left:var(--grid-pad);transform:translateY(-50%);z-index:17;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:var(--bottom-btn);max-height:calc(100vh - var(--top-anchor) - var(--bottom-anchor) - 40px);overflow-y:auto;overflow-x:hidden;padding:4px}
.left-stack>*{pointer-events:auto}
.side-tools{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.side-btn{width:var(--bottom-btn);height:var(--bottom-btn);border-radius:14px;border:none;background:transparent;color:var(--ui-icon-color);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--icon-size-lg);transition:color .15s,background .15s;position:relative;padding:0;flex-shrink:0}
.side-btn:hover{color:var(--ui-icon-color-hover)}
.side-btn.open{color:var(--ui-accent);background:var(--active-highlight)}
.side-btn.open::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:3px;height:40%;background:var(--ui-accent);border-radius:2px}
.right-stack .side-btn.open::after{right:auto;left:-4px}
.side-sep{width:24px;height:1px;background:var(--ui-strip-border);margin:2px auto;align-self:center;flex-shrink:0}
.zoom-slider{display:flex;flex-direction:column;align-items:center;gap:4px;width:var(--bottom-btn);flex-shrink:0;margin-top:6px}
.zoom-slider .z-icon{font-size:var(--ui-fs-small);color:var(--ui-label-color)}
.zoom-slider .z-input-wrap{display:flex;align-items:center;justify-content:center;width:100%}
.zoom-slider .z-input{background:transparent;border:none;color:var(--ui-text-on-strip);font-family:'SF Mono',ui-monospace,monospace;font-size:var(--ui-fs-small);font-weight:700;padding:0;outline:none;text-align:center;width:100%;-moz-appearance:textfield;opacity:.9}
.zoom-slider .z-input::-webkit-outer-spin-button,.zoom-slider .z-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.zoom-slider .z-track{position:relative;width:24px;height:calc(var(--tile-base) * 1.5);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;user-select:none;outline:none}
.zoom-slider .z-track::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--ui-track);opacity:.85;border-radius:3px;pointer-events:none}
.zoom-slider .z-thumb{position:absolute;left:50%;width:22px;height:22px;margin-left:-11px;margin-top:-11px;background:var(--ui-accent);border:2px solid var(--ui-text-on-strip);border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none;will-change:top}

.right-stack{position:absolute;top:50%;transform:translateY(-50%);right:var(--grid-pad);z-index:18;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-height:calc(100vh - var(--top-anchor) - var(--bottom-anchor) - 40px);overflow-y:auto;overflow-x:hidden;padding:4px}
.right-stack>*{pointer-events:auto}

.bottom-bar-outer{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--grid-pad));z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:0 var(--grid-pad);pointer-events:none;gap:8px}
.bottom-bar-outer>*{pointer-events:auto}
.bottom-left-group{display:flex;align-items:center;gap:2px;flex-shrink:0;pointer-events:auto}
.screenshot-btn-left{width:var(--bottom-btn);height:var(--bottom-btn);border-radius:50%;border:none;background:transparent;color:var(--ui-icon-color);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--icon-size-md);transition:color .15s,background .15s;flex-shrink:0;padding:0;outline:none}
.screenshot-btn-left:hover{color:var(--ui-icon-color-hover);background:var(--active-highlight)}
.bottom-center{flex:1;display:flex;justify-content:center;min-width:0;align-items:flex-end}
.bottom-strip{display:flex;align-items:center;gap:4px;background:var(--ui-strip);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-radius:calc(var(--bottom-btn) / 2 + 6px);padding:6px;box-shadow:var(--ui-strip-shadow);border:1px solid var(--ui-strip-border);color:var(--ui-text-on-strip)}
.tool-btn{width:var(--bottom-btn);height:var(--bottom-btn);border-radius:50%;border:none;background:transparent;color:var(--ui-icon-color);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--icon-size-md);transition:background .15s,color .15s;position:relative;flex-shrink:0;padding:0}
.tool-btn:hover{color:var(--ui-icon-color-hover)}
.tool-btn .badge-val{position:absolute;bottom:4px;right:5px;background:rgba(99,102,241,.35);color:var(--ui-text-on-strip);font-size:var(--ui-fs-tiny);font-weight:700;padding:1px 5px;border-radius:6px;font-family:'SF Mono',ui-monospace,monospace;min-width:18px;text-align:center;line-height:1.2;pointer-events:none}
body.theme-light .tool-btn .badge-val{color:#fff;background:rgba(99,102,241,.85)}
.tool-sep{width:1px;height:calc(var(--bottom-btn) * .55);background:var(--ui-strip-border);margin:0 3px;flex-shrink:0}

/* ============================================================
   SHADER — real Milky Way (galactic plane, dust lanes, core),
   real aurora (auroral oval), moon with craters & phase,
   working ambient contribution.
   ============================================================ */
const SKY_COMMON = `
precision highp float;
uniform float uSunElev, uSunAzim, uSunIntensity, uSunSize;
uniform vec3 uSunColor, uHorizonColor, uZenithColor, uGroundColor, uAmbientColor, uCloudColor, uAuroraColor;
uniform float uHorizonHeight, uHorizonBlur, uAmbientStrength;
uniform float uCloudCoverage, uCloudDensity, uCloudSharpness, uCloudSpeed, uCloudShadow;
uniform float uStarDensity, uStarBrightness, uStarTwinkle, uStarSize, uMilkyWay, uMilkyWaySpeed;
uniform float uAuroraIntensity, uAuroraHeight, uAuroraSpeed;
uniform float uUseMoon, uMoonPhase;
uniform float uTime;
uniform float uUsePanorama;
uniform float uLayerTop;
uniform sampler2D uPanorama;

float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float noise3(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash13(i);
  float b = hash13(i + vec3(1,0,0));
  float c = hash13(i + vec3(0,1,0));
  float d = hash13(i + vec3(1,1,0));
  float e = hash13(i + vec3(0,0,1));
  float f1 = hash13(i + vec3(1,0,1));
  float g = hash13(i + vec3(0,1,1));
  float h = hash13(i + vec3(1,1,1));
  float x00 = mix(a,b,f.x), x10 = mix(c,d,f.x);
  float x01 = mix(e,f1,f.x), x11 = mix(g,h,f.x);
  return mix(mix(x00,x10,f.y), mix(x01,x11,f.y), f.z);
}
float fbm3(vec3 p, int oct){
  float v = 0.0, amp = 0.5;
  for (int i = 0; i < 6; i++){ if (i >= oct) break; v += amp * noise3(p); amp *= 0.5; p *= 2.0; }
  return v;
}

vec3 sunDirection(){ float e = radians(uSunElev); float a = radians(uSunAzim); return vec3(cos(e)*sin(a), sin(e), cos(e)*cos(a)); }
vec2 dirToUV(vec3 n){
  float u = atan(n.x, n.z) / 6.28318530718 + 0.5;
  float v = acos(clamp(n.y, -1.0, 1.0)) / 3.14159265359;
  return vec2(fract(u), clamp(v, 0.001, 0.999));
}
vec3 samplePanorama(vec3 n){ return texture2D(uPanorama, dirToUV(n)).rgb; }

/* ========== MILKY WAY ==========
   Real model: our solar system sits inside the Galactic plane
   (approx 62° from the ecliptic). Direction of Galactic center ≈
   RA 17h45m, Dec −29°. Rendering: project direction onto the
   Galactic plane normal, get a band; modulate by FBM for the
   Great Rift (dust lanes); core brightness peaks toward GC. */
vec3 milkyWayLayer(vec3 dir){
  if (uMilkyWay <= 0.001) return vec3(0.0);
  float t = uTime * uMilkyWaySpeed;
  // Galactic plane normal (unit) — tilted
  float tilt = radians(62.87);
  vec3 galNormal = vec3(0.0, cos(tilt), sin(tilt));
  // rotation of the whole band over time (very slow), simulating observer motion
  float ca = cos(t * 0.02), sa = sin(t * 0.02);
  vec3 rdir = vec3(dir.x * ca - dir.y * sa, dir.x * sa + dir.y * ca, dir.z);
  float band = 1.0 - abs(dot(normalize(rdir), galNormal));
  band = smoothstep(0.82, 1.0, band);   // narrow strip only

  // Galactic center direction — where the core is brightest
  vec3 gcDir = normalize(vec3(-0.04, 0.15, 1.0));
  float core = pow(max(dot(normalize(dir), gcDir), 0.0), 3.0);
  core = smoothstep(0.5, 1.0, core);

  // Dust lanes: FBM in galactic-plane coordinates, very fine structure
  vec3 planeP = dir * 6.0 + vec3(t * 0.01, 0.0, 0.0);
  float dust = fbm3(planeP, 5);
  float dustMask = smoothstep(0.45, 0.75, dust);

  // The core is dense, warm; edges are cool blue
  vec3 coreColor = vec3(1.0, 0.85, 0.65);
  vec3 edgeColor = vec3(0.7, 0.8, 1.0);
  vec3 base = mix(edgeColor, coreColor, core);

  float intensity = band * (0.4 + 0.6 * core);
  intensity *= (1.0 - dustMask * 0.6);  // dark dust lanes
  intensity *= smoothstep(0.0, 0.15, dir.y);
  return base * intensity * uMilkyWay * 1.6;
}

/* ========== AURORA (auroral oval) ========== */
vec3 auroraLayer(vec3 dir){
  if (uAuroraIntensity < 0.001) return vec3(0.0);
  if (dir.y < -0.02) return vec3(0.0);
  float bandCenter = 0.28 + uAuroraHeight * 0.25;
  float bandWidth = 0.20 + 0.10 * sin(uTime * 0.02 * uAuroraSpeed);
  float band = exp(-pow((dir.y - bandCenter) / bandWidth, 2.0));
  float az = atan(dir.x, dir.z);
  float longitudeWarp = sin(az * 3.0 + uTime * 0.015 * uAuroraSpeed) * 0.4
                      + sin(az * 7.0 + uTime * 0.025 * uAuroraSpeed) * 0.15;
  float rayPattern = sin(az * 40.0 + longitudeWarp * 8.0 + uTime * 0.03 * uAuroraSpeed);
  float curtainMask = smoothstep(0.25, 0.85, rayPattern * 0.5 + 0.5);
  float verticalRays = 0.0;
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float h = (dir.y - bandCenter) * (8.0 + fi * 2.0);
    float n = fbm3(vec3(az * 4.0 + fi * 2.0 + uTime * 0.02 * uAuroraSpeed, h, fi * 3.0), 3);
    verticalRays += smoothstep(0.55, 0.9, n) * (1.0 - fi * 0.3);
  }
  verticalRays *= band;
  float green555 = exp(-pow((dir.y - (bandCenter - 0.04)) / 0.06, 2.0));
  float red630 = exp(-pow((dir.y - (bandCenter + 0.08)) / 0.10, 2.0)) * 0.6;
  vec3 green = vec3(0.05, 1.0, 0.35);
  vec3 red   = vec3(1.0, 0.15, 0.2);
  vec3 tint = mix(uAuroraColor, green, 0.6);
  vec3 result = tint * green555 * 1.4 + red * red630 * 0.7;
  result *= curtainMask * (0.55 + verticalRays * 0.75);
  result *= smoothstep(0.0, 0.15, dir.y);
  return result * uAuroraIntensity;
}

float starField(vec3 d){
  if (uStarDensity <= 0.001) return 0.0;
  vec3 p = d * 260.0;
  vec3 i = floor(p);
  float h = hash13(i);
  if (h < (1.0 - uStarDensity)) return 0.0;
  vec3 f = fract(p) - 0.5;
  float r = length(f);
  float tw = 1.0 + sin(uTime * 5.0 + h * 60.0) * uStarTwinkle;
  float sz = clamp(uStarSize * 320.0, 0.05, 1.0);
  return smoothstep(sz, 0.0, r) * uStarBrightness * tw * smoothstep(0.05, 0.4, d.y);
}

/* ========== MOON (with craters, phase) ========== */
vec3 moonLayer(vec3 dir, vec3 sunDir){
  if (uUseMoon < 0.5) return vec3(0.0);
  float moonDot = dot(dir, sunDir);
  // disk
  float disk = smoothstep(1.0 - uSunSize * 1.2, 1.0, moonDot);
  if (disk < 0.001) return vec3(0.0);
  // Phase: moon illuminated fraction (0 = new, 0.5 = half, 1 = full)
  // Compute phase by rotating sun direction around moon vertical axis
  vec3 moonRight = normalize(cross(vec3(0.0, 1.0, 0.0), sunDir));
  if (length(moonRight) < 0.01) moonRight = vec3(1.0, 0.0, 0.0);
  vec3 moonUp = cross(sunDir, moonRight);
  // Local coordinates on the moon's disk
  vec2 local = vec2(dot(dir, moonRight), dot(dir, moonUp));
  float phi = local.x;
  // The terminator line depends on phase
  float lit = smoothstep(-0.05, 0.05, phi + (uMoonPhase - 0.5) * 2.0);
  // Craters — high-frequency noise on the moon surface
  vec3 p = dir * 40.0;
  float craters = fbm3(p, 4);
  vec3 moonBase = vec3(0.85, 0.88, 0.92);
  moonBase *= (0.7 + 0.3 * craters);
  vec3 col = moonBase * lit * disk * 2.5;
  return col;
}

vec3 computeSky(vec3 dir){
  if (uLayerTop < 0.5) return vec3(0.0);
  vec3 base;
  vec3 sunDir = sunDirection();
  float sunDot = dot(dir, sunDir);

  if (uUsePanorama > 0.5) {
    base = samplePanorama(dir);
    // In panorama mode, still show sun/moon disk overlay
    float disk = smoothstep(1.0 - uSunSize, 1.0, sunDot);
    float glow = pow(max(sunDot, 0.0), 96.0) * 0.5;
    base += uSunColor * (disk * uSunIntensity + glow) * 0.4;
  } else {
    float sunDisk = smoothstep(1.0 - uSunSize, 1.0, sunDot);
    float sunGlow = pow(max(sunDot, 0.0), 96.0) * 0.8;
    float sunHalo = pow(max(sunDot, 0.0), 8.0) * 0.35;
    float hBand = smoothstep(-uHorizonBlur, uHorizonBlur, dir.y + uHorizonHeight);
    float upperMix = clamp(dir.y * 1.6 + 0.2, 0.0, 1.0);
    vec3 up = mix(uHorizonColor, uZenithColor, upperMix);
    vec3 lo = mix(uHorizonColor, uGroundColor, smoothstep(0.0, -0.35, dir.y));
    base = mix(lo, up, hBand);
    if (uUseMoon < 0.5) {
      base += uSunColor * (sunDisk * uSunIntensity + sunHalo + sunGlow) * 0.5;
    }
    if (uCloudDensity > 0.001 && dir.y > 0.0) {
      vec3 p = dir * 5.0;
      p.xz += uTime * uCloudSpeed * 8.0;
      float n = fbm3(p, 5);
      float cover = smoothstep(uCloudCoverage, uCloudCoverage + 0.08, n);
      float mask = smoothstep(0.0, 0.35, dir.y);
      float c = clamp(cover * mask * uCloudDensity, 0.0, 1.0);
      vec3 cc = mix(uCloudColor, uCloudColor * (1.0 - uCloudShadow), c * 0.8);
      base = mix(base, cc, c);
    }
  }

  // Moon (overrides sun when enabled)
  if (uUseMoon > 0.5) base += moonLayer(dir, sunDir);

  // Stars, Milky Way, Aurora
  base += vec3(starField(dir)) * (uUsePanorama > 0.5 ? 0.7 : 1.0);
  base += milkyWayLayer(dir);
  base += auroraLayer(dir);

  // Ambient — now actually applied
  if (uAmbientStrength > 0.001) {
    vec3 amb = uAmbientColor * uAmbientStrength;
    base = mix(base, base + amb, 0.35);
    base += amb * 0.08;
  }

  return base;
}
`;

const skyUniforms = {
  uSunElev: { value: 35 }, uSunAzim: { value: 45 },

  uSunIntensity: { value: 6 }, uSunSize: { value: 0.025 },

  uCloudSharpness: { value: 0.55 }, uCloudSpeed: { value: 0.02 },
  uCloudColor: { value: new THREE.Color('#ffffff') }, uCloudShadow: { value: 0.35 },

const u = skyUniforms;

function makeEmptyTexture() {
  const data = new Uint8Array([0, 0, 0, 255]);
  const tex = new THREE.DataTexture(data, 1, 1, THREE.RGBAFormat);
  tex.needsUpdate = true;
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}
u.uPanorama.value = makeEmptyTexture();

const skyMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: true,
  uniforms: skyUniforms,
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: SKY_COMMON + `varying vec3 vDir; void main(){ gl_FragColor = vec4(computeSky(normalize(vDir)), 1.0); }`,
});
const skyGeo = new THREE.SphereGeometry(100, 96, 64);
const skyMesh = new THREE.Mesh(skyGeo, skyMaterial);

  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: SKY_COMMON + `
    varying vec2 vUv;
    void main(){
      float az = (vUv.x - 0.5) * 6.28318530718;
      float po = (1.0 - vUv.y) * 3.14159265359;
      vec3 dir = vec3(sin(po) * sin(az), cos(po), sin(po) * cos(az));
      gl_FragColor = vec4(computeSky(dir), 1.0);
    }`,
});
const eqScene = new THREE.Scene();

function applyPreset(name) {
  const p = PRESETS[name]; if (!p) return;
  state.preset = name;
  Object.keys(p).forEach(k => { state[k] = p[k]; });
  if (u.uPanorama.value && !u.uPanorama.value.isDataTexture) { try { u.uPanorama.value.dispose(); } catch (e) {} }
  u.uPanorama.value = makeEmptyTexture();
  u.uUsePanorama.value = 0;
  saveState(); applyStateToUniforms();
  invalidateCubePreview(); updateLayerPreviews();
}

function makeSeamlessCanvas(src, strength = 0.6) {
  const w = src.width, h = src.height;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const ctx = out.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0);
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const original = new Uint8ClampedArray(d);
  const radius = Math.max(8, Math.round(Math.min(w, h) * 0.15 * strength));
  const blend = new Uint8ClampedArray(d.length);
  const halfW = Math.floor(w / 2), halfH = Math.floor(h / 2);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const o = (y * w + x) * 4;
      const so = (((y + halfH) % h) * w + ((x + halfW) % w)) * 4;
      blend[o] = original[so]; blend[o+1] = original[so+1]; blend[o+2] = original[so+2]; blend[o+3] = 255;
    }
  }
  for (let y = 0; y < h; y++) {
    const dyEdge = Math.min(y, h - 1 - y);
    for (let x = 0; x < w; x++) {
      const dxEdge = Math.min(x, w - 1 - x);
      const edgeDist = Math.min(dxEdge, dyEdge);
      if (edgeDist < radius) {
        const t = Math.min(1, edgeDist / radius);
        const wBlend = 1 - t * t * (3 - 2 * t);
        const o = (y * w + x) * 4;
        d[o] = original[o] * (1 - wBlend) + blend[o] * wBlend;
        d[o+1] = original[o+1] * (1 - wBlend) + blend[o+1] * wBlend;
        d[o+2] = original[o+2] * (1 - wBlend) + blend[o+2] * wBlend;
      }
    }
  }
  const poleRows = Math.max(4, Math.round(h * 0.04));
  for (let y = 0; y < poleRows; y++) {
    const srcY = Math.min(h - 1, poleRows);
    for (let x = 0; x < w; x++) {
      const dstO = (y * w + x) * 4, srcO = (srcY * w + x) * 4;
      d[dstO] = original[srcO]; d[dstO+1] = original[srcO+1]; d[dstO+2] = original[srcO+2];
    }
  }
  for (let y = h - poleRows; y < h; y++) {
    const srcY = Math.max(0, h - 1 - poleRows);
    for (let x = 0; x < w; x++) {
      const dstO = (y * w + x) * 4, srcO = (srcY * w + x) * 4;
      d[dstO] = original[srcO]; d[dstO+1] = original[srcO+1]; d[dstO+2] = original[srcO+2];
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return out;
}

function handlePanoramaFile(file) {
  if (!file) return;
  if (!file.type || !file.type.startsWith('image/')) { showToast(LANG.t('toastNotImage'), true); return; }
  if (file.size > MAX_FILE_SIZE) { showToast(LANG.t('toastFileBig'), true); return; }
  loading.classList.add('show');
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    try {
      const MAX = 8192;
      let w = img.width, h = img.height;
      if (Math.max(w, h) > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const seamless = makeSeamlessCanvas(c, 0.6);
      const tex = new THREE.CanvasTexture(seamless);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      if (u.uPanorama.value && !u.uPanorama.value.isDataTexture) { try { u.uPanorama.value.dispose(); } catch (e) {} }
      u.uPanorama.value = tex;
      u.uUsePanorama.value = 1;

function renderEquirectangular(size) {
  const w = size, h = Math.max(1, Math.round(size / 2));

    const src = u.uPanorama.value.image;

  }
  const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.UnsignedByteType, format: THREE.RGBAFormat, colorSpace: THREE.SRGBColorSpace, depthBuffer: false });
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(rt);

  renderer.setRenderTarget(prev);
  const buf = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, w, h, buf);

  const c = document.createElement('canvas'); c.width = w; c.height = h;

}

function renderCubeFaces(size) {
  const faces = ['px', 'nx', 'py', 'ny', 'pz', 'nz'];
  const dirs = {
    px: { d: [1, 0, 0], up: [0, 1, 0] }, nx: { d: [-1, 0, 0], up: [0, 1, 0] },
    py: { d: [0, 1, 0], up: [0, 0, -1] }, ny: { d: [0, -1, 0], up: [0, 0, 1] },
    pz: { d: [0, 0, 1], up: [0, 1, 0] }, nz: { d: [0, 0, -1], up: [0, 1, 0] },
  };
  const out = {};
  const rt = new THREE.WebGLRenderTarget(size, size, { type: THREE.UnsignedByteType, format: THREE.RGBAFormat, colorSpace: THREE.SRGBColorSpace, depthBuffer: false });
  const cam = new THREE.PerspectiveCamera(90, 1, 0.01, 200);
  cam.position.set(0, 0, 0);
  const buf = new Uint8Array(size * size * 4);
  const prev = renderer.getRenderTarget();
  for (const f of faces) {
    const d = dirs[f];
    cam.up.set(d.up[0], d.up[1], d.up[2]);
    cam.lookAt(d.d[0], d.d[1], d.d[2]);
    cam.updateMatrixWorld();
    renderer.setRenderTarget(rt);
    renderer.render(captureScene, cam);
    renderer.setRenderTarget(prev);
    renderer.readRenderTargetPixels(rt, 0, 0, size, size, buf);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const imgData = ctx.createImageData(size, size);
    for (let y = 0; y < size; y++) {
      const src = (size - 1 - y) * size * 4, dst = y * size * 4;
      for (let x = 0; x < size * 4; x++) imgData.data[dst + x] = buf[src + x];
    }
    ctx.putImageData(imgData, 0, 0);
    out[f] = c;
  }
  rt.dispose();
  return out;
}

function writeHDR(canvas) {

  const data = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const header = `#?RADIANCE\n# Skybox Studio HDRI\nFORMAT=32-bit_rle_rgbe\n\n-Y ${h} +X ${w}\n`;
  const encoder = new TextEncoder();
  const chunks = [encoder.encode(header)];
  const rgbe = new Uint8Array(w * 4);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = data[i] / 255, g = data[i+1] / 255, b = data[i+2] / 255;
      const maxC = Math.max(r, g, b);
      if (maxC < 1e-6) { rgbe[x*4]=rgbe[x*4+1]=rgbe[x*4+2]=rgbe[x*4+3]=0; continue; }

      rgbe[x*4] = Math.min(255, Math.max(0, Math.floor(r * s)));
      rgbe[x*4+1] = Math.min(255, Math.max(0, Math.floor(g * s)));
      rgbe[x*4+2] = Math.min(255, Math.max(0, Math.floor(b * s)));
      rgbe[x*4+3] = Math.max(0, Math.min(255, e + 128));
    }
    const ch = [new Uint8Array(w), new Uint8Array(w), new Uint8Array(w), new Uint8Array(w)];
    for (let x = 0; x < w; x++) { ch[0][x]=rgbe[x*4]; ch[1][x]=rgbe[x*4+1]; ch[2][x]=rgbe[x*4+2]; ch[3][x]=rgbe[x*4+3]; }
    chunks.push(new Uint8Array([2, 2, (w >> 8) & 0xFF, w & 0xFF]));
    for (let c = 0; c < 4; c++) {
      const row = ch[c]; let i = 0;
      while (i < w) {
        let run = 0;
        while (run < 127 && i + run + 1 < w && row[i+run] === row[i+run+1]) run++;
        if (run > 3) {
          let len = 0; const v = row[i];
          while (i + len < w && row[i+len] === v && len < 127) len++;

        } else {
          let len = 0;
          while (len < 127 && i + len < w) {

            len++;

  return out;
}

function buildZip(files) {

  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2)) & 0xFFFF;
  const dosDate = (((y - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  let offset = 0;
  for (const f of files) {
    const nameBytes = encoder.encode(f.name);

    const dv = new DataView(lfh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, dosTime, true); dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
    lfh.set(nameBytes, 30);
    parts.push(lfh); parts.push(f.data);
    const cd = new Uint8Array(46 + nameBytes.length);
    const dv2 = new DataView(cd.buffer);
    dv2.setUint32(0, 0x02014b50, true); dv2.setUint16(4, 20, true); dv2.setUint16(6, 20, true);
    dv2.setUint16(8, 0x0800, true); dv2.setUint16(10, 0, true); dv2.setUint16(12, dosTime, true);
    dv2.setUint16(14, dosDate, true); dv2.setUint32(16, crc, true); dv2.setUint32(20, size, true);
    dv2.setUint32(24, size, true); dv2.setUint16(28, nameBytes.length, true); dv2.setUint16(30, 0, true);

  for (const p of parts) { res.set(p, pos); pos += p.length; }
  return res;
}

function downloadBlob(blob, filename) {

}
function filenameBase() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `skybox_${state.preset}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

async function doExport(kind) {
  loading.classList.add('show');
  await new Promise(r => setTimeout(r, 30));
  try {
    const base = filenameBase();
    if (kind === 'hdr') {
      const c = renderEquirectangular(state.resolution);
      downloadBlob(new Blob([writeHDR(c)], { type: 'image/vnd.radiance' }), `${base}.hdr`);
    } else if (kind === 'png') {
      const c = renderEquirectangular(state.resolution);
      const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/png'));
      downloadBlob(blob, `${base}_pano.png`);
    } else if (kind === 'cube-zip') {
      const faceSize = Math.max(64, Math.min(state.resolution, 2048));
      const faces = renderCubeFaces(faceSize);
      const files = [];
      for (const name of ['px','nx','py','ny','pz','nz']) {
        const blob = await new Promise((res, rej) => faces[name].toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/png'));
        files.push({ name: `${base}_${name}.png`, data: new Uint8Array(await blob.arrayBuffer()) });
      }
      downloadBlob(new Blob([buildZip(files)], { type: 'application/zip' }), `${base}_cube.zip`);
    } else if (kind === 'cube-gltf') {
      const faceSize = Math.max(64, Math.min(state.resolution, 2048));
      const faces = renderCubeFaces(faceSize);
      const files = []; const uris = {};
      for (const name of ['px','nx','py','ny','pz','nz']) {
        const blob = await new Promise((res, rej) => faces[name].toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/png'));
        const fname = `${base}_${name}.png`; uris[name] = fname;
        files.push({ name: fname, data: new Uint8Array(await blob.arrayBuffer()) });
      }
      const positions = new Float32Array([-1,-1,0, 1,-1,0, 1,1,0, -1,1,0]);
      const uvs = new Float32Array([0,0, 1,0, 1,1, 0,1]);
      const indices = new Uint16Array([0,1,2, 0,2,3]);
      const posLen = positions.byteLength, uvLen = uvs.byteLength, idxLen = indices.byteLength;
      const pad4 = n => (n + 3) & ~3;
      const uvOff = pad4(posLen), idxOff = pad4(uvOff + uvLen);
      const total = idxOff + pad4(idxLen);
      const buffer = new Uint8Array(total);
      buffer.set(new Uint8Array(positions.buffer), 0);
      buffer.set(new Uint8Array(uvs.buffer), uvOff);
      buffer.set(new Uint8Array(indices.buffer), idxOff);
      let b64 = ''; const chunk = 0x8000;
      for (let i = 0; i < buffer.length; i += chunk) b64 += btoa(String.fromCharCode.apply(null, buffer.subarray(i, i + chunk)));
      const gltf = {
        asset: { version: '2.0', generator: 'Skybox Studio v1.0' },
        scenes: [{ nodes: [0] }], nodes: [{ name: 'Skybox', mesh: 0 }],
        meshes: [{ primitives: [{ attributes: { POSITION: 0, TEXCOORD_0: 1 }, indices: 2, material: 0, mode: 4 }] }],
        materials: [{ pbrMetallicRoughness: { baseColorTexture: { index: 0 }, metallicFactor: 0, roughnessFactor: 1 }, doubleSided: true }],
        textures: [{ source: 0, sampler: 0 }],
        samplers: [{ magFilter: 9729, minFilter: 9987, wrapS: 10497, wrapT: 10497 }],
        images: [{ uri: uris.px }],
        buffers: [{ byteLength: buffer.length, uri: 'data:application/octet-stream;base64,' + b64 }],
        bufferViews: [
          { buffer: 0, byteOffset: 0, byteLength: posLen, target: 34962 },
          { buffer: 0, byteOffset: uvOff, byteLength: uvLen, target: 34962 },
          { buffer: 0, byteOffset: idxOff, byteLength: idxLen, target: 34963 },
        ],
        accessors: [
          { bufferView: 0, componentType: 5126, count: 4, type: 'VEC3', min: [-1,-1,0], max: [1,1,0] },
          { bufferView: 1, componentType: 5126, count: 4, type: 'VEC2' },
          { bufferView: 2, componentType: 5123, count: 6, type: 'SCALAR' },
        ],
      };
      files.push({ name: `${base}.gltf`, data: new TextEncoder().encode(JSON.stringify(gltf, null, 2)) });
      downloadBlob(new Blob([buildZip(files)], { type: 'application/zip' }), `${base}_gltf.zip`);
    }
    showToast(LANG.t('toastExported'));
  } catch (e) { console.error(e); showToast(LANG.t('toastExportError') + ': ' + (e.message || ''), true); }
  finally { loading.classList.remove('show'); }
}

const presetPreviewCache = new Map();
let presetPreviewGen = 0;
function invalidatePresetPreviews() { presetPreviewCache.clear(); presetPreviewGen++; }

function capturePresetPreview(presetKey) {
  const gen = presetPreviewGen;
  const key = `${presetKey}_${gen}`;
  if (presetPreviewCache.has(key)) return presetPreviewCache.get(key);
  const preset = PRESETS[presetKey];
  if (!preset) return '';
  try {
    const tmpUniforms = {};
    Object.keys(skyUniforms).forEach(k => {
      const uu = skyUniforms[k];
      if (uu.value instanceof THREE.Color) tmpUniforms[k] = { value: uu.value.clone() };
      else tmpUniforms[k] = { value: uu.value };
    });
    // Apply preset values
    Object.keys(preset).forEach(key => {
      if (key === 'useMoon') { tmpUniforms.uUseMoon.value = preset.useMoon ? 1 : 0; return; }
      if (key === 'moonPhase') { tmpUniforms.uMoonPhase.value = preset.moonPhase || 0.5; return; }
      const uKey = 'u' + key.charAt(0).toUpperCase() + key.slice(1);
      if (!(uKey in tmpUniforms)) return;
      if (tmpUniforms[uKey].value instanceof THREE.Color) tmpUniforms[uKey].value.set(preset[key]);
      else tmpUniforms[uKey].value = preset[key];
    });
    tmpUniforms.uTime.value = 0;
    tmpUniforms.uUsePanorama.value = 0;
    tmpUniforms.uLayerTop.value = 1;

    const previewMat = new THREE.ShaderMaterial({
      uniforms: tmpUniforms,
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: SKY_COMMON + `
        varying vec2 vUv;
        void main(){
          float az = (vUv.x - 0.5) * 6.28318530718;
          float po = (1.0 - vUv.y) * 3.14159265359;
          vec3 dir = vec3(sin(po) * sin(az), cos(po), sin(po) * cos(az));
          gl_FragColor = vec4(computeSky(dir), 1.0);
        }`,
      depthTest: false, depthWrite: false,
    });
    const previewScene = new THREE.Scene();
    const previewQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), previewMat);
    previewQuad.frustumCulled = false;
    previewScene.add(previewQuad);

    const size = 128;
    const rt = new THREE.WebGLRenderTarget(size, size, { type: THREE.UnsignedByteType, format: THREE.RGBAFormat, colorSpace: THREE.SRGBColorSpace, depthBuffer: false });
    const prev = renderer.getRenderTarget();
    renderer.setRenderTarget(rt);
    renderer.render(previewScene, eqCam);
    renderer.setRenderTarget(prev);
    const buf = new Uint8Array(size * size * 4);
    renderer.readRenderTargetPixels(rt, 0, 0, size, size, buf);
    rt.dispose(); previewMat.dispose(); previewQuad.geometry.dispose();

    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const imgData = ctx.createImageData(size, size);
    for (let y = 0; y < size; y++) {
      const src = (size - 1 - y) * size * 4, dst = y * size * 4;
      for (let x = 0; x < size * 4; x++) imgData.data[dst + x] = buf[src + x];
    }
    ctx.putImageData(imgData, 0, 0);
    const url = c.toDataURL('image/png');
    if (gen === presetPreviewGen) presetPreviewCache.set(key, url);
    return url;
  } catch (e) { console.error('capturePresetPreview:', e); return ''; }
}

function bindToolHandlers(el, tool) {
  const pairs = {
    sun: [ { id: 'sunElev', key: 'sunElev', fmt: v => String(Math.round(v)) }, { id: 'sunAzim', key: 'sunAzim', fmt: v => String(Math.round(v)) }, { id: 'sunSize', key: 'sunSize', fmt: v => v.toFixed(3) }, { id: 'sunIntensity', key: 'sunIntensity', fmt: v => v.toFixed(1) }, { id: 'moonPhase', key: 'moonPhase', fmt: v => v.toFixed(2) } ],
    clouds: [ { id: 'cloudCoverage', key: 'cloudCoverage', fmt: v => v.toFixed(2) }, { id: 'cloudDensity', key: 'cloudDensity', fmt: v => v.toFixed(2) }, { id: 'cloudSharpness', key: 'cloudSharpness', fmt: v => v.toFixed(2) }, { id: 'cloudSpeed', key: 'cloudSpeed', fmt: v => v.toFixed(3) }, { id: 'cloudShadow', key: 'cloudShadow', fmt: v => v.toFixed(2) } ],
    stars: [ { id: 'starDensity', key: 'starDensity', fmt: v => v.toFixed(2) }, { id: 'starBrightness', key: 'starBrightness', fmt: v => v.toFixed(2) }, { id: 'starTwinkle', key: 'starTwinkle', fmt: v => v.toFixed(2) }, { id: 'starSize', key: 'starSize', fmt: v => v.toFixed(4) }, { id: 'milkyWay', key: 'milkyWay', fmt: v => v.toFixed(2) }, { id: 'milkyWaySpeed', key: 'milkyWaySpeed', fmt: v => v.toFixed(2) } ],
    aurora: [ { id: 'auroraIntensity', key: 'auroraIntensity', fmt: v => v.toFixed(2) }, { id: 'auroraHeight', key: 'auroraHeight', fmt: v => v.toFixed(2) }, { id: 'auroraSpeed', key: 'auroraSpeed', fmt: v => v.toFixed(2) } ],
    horizon: [ { id: 'horizonHeight', key: 'horizonHeight', fmt: v => v.toFixed(2) }, { id: 'horizonBlur', key: 'horizonBlur', fmt: v => v.toFixed(2) } ],
    ambient: [{ id: 'ambientStrength', key: 'ambientStrength', fmt: v => v.toFixed(2) }],
    intensity: [{ id: 'intensity', key: 'intensity', fmt: v => v.toFixed(2) }],
    exposure: [{ id: 'exposure', key: 'exposure', fmt: v => v.toFixed(2) }],
    grid: [ { id: 'gridOpacitySlider', key: 'gridOpacity', fmt: v => v.toFixed(2) }, { id: 'gridSizeSlider', key: 'gridSize', fmt: v => String(Math.round(v)) } ],
    ground: [{ id: 'groundOpacitySlider', key: 'groundOpacity', fmt: v => v.toFixed(2) }],
  };
  (pairs[tool] || []).forEach(p => {
    const slider = el.querySelector('#' + p.id); if (!slider) return;
    const num = el.querySelector('#' + p.id + 'Val') || el.querySelector('#' + p.id.replace(/Slider$/, '') + 'Val');
    if (num) bindSliderPair(slider, num, p.fmt, v => { state[p.key] = v; if (p.key === 'gridSize') buildGridAndGround(); applyGridAndGround(); });
  });

  const useMoonEl = el.querySelector('#useMoonToggle');
  if (useMoonEl) useMoonEl.addEventListener('change', () => { state.useMoon = useMoonEl.checked; applyStateToUniforms(); saveState(); pushHistory(); invalidatePresetPreviews(); });

  const bindColor = (id, key, extra) => {
    const inp = el.querySelector('#' + id); if (!inp) return;
    inp.addEventListener('input', () => { state[key] = inp.value; if (extra) extra(); applyStateToUniforms(); saveState(); invalidateCubePreview(); invalidatePresetPreviews(); updateLayerPreviews(); });
    inp.addEventListener('change', () => pushHistory());
  };
  bindColor('sunColor', 'sunColor'); bindColor('cloudColor', 'cloudColor');
  bindColor('horizonColor', 'horizonColor'); bindColor('ambientColor', 'ambientColor');
  bindColor('auroraColor', 'auroraColor');
  bindColor('gridColorInput', 'gridColor', applyGridAndGround); bindColor('groundColorInput', 'groundColor', applyGridAndGround);

  const bindToggle = (id, key, extra) => {
    const inp = el.querySelector('#' + id); if (!inp) return;
    inp.addEventListener('change', () => { state[key] = inp.checked; if (extra) extra(); saveState(); pushHistory(); });
  };
  bindToggle('gridVisibleToggle', 'gridVisible', applyGridAndGround);
  bindToggle('groundVisibleToggle', 'groundVisible', applyGridAndGround);

  el.querySelectorAll('[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      applyPreset(btn.dataset.preset);
      el.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === state.preset));
      applyContrastByPreset();
      pushHistory();
    });
  });
  el.querySelectorAll('[data-res]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.resolution = parseInt(btn.dataset.res, 10);
      applyStateToUniforms(); saveState(); invalidateCubePreview(); pushHistory();
      el.querySelectorAll('[data-res]').forEach(b => {
        const active = parseInt(b.dataset.res, 10) === state.resolution;
        b.style.background = active ? 'var(--ui-accent)' : 'var(--pop-tile-bg)';
        b.style.color = active ? '#fff' : 'var(--pop-tile-text)';
      });
    });
  });
  el.querySelectorAll('[data-proj]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.projection = btn.dataset.proj; saveState();
      el.querySelectorAll('[data-proj]').forEach(b => b.classList.toggle('active', b.dataset.proj === state.projection));
      pushHistory();
    });
  });
  el.querySelectorAll('[data-export]').forEach(btn => { btn.addEventListener('click', () => doExport(btn.dataset.export)); });
  el.querySelectorAll('[id$="Reset"]').forEach(btn => { btn.addEventListener('click', () => { applyPreset(state.preset); pushHistory(); }); });
}

const TERMS_SECTIONS = {

    { title: 'Предоставление', body: '<p><strong>Skybox Studio</strong> предоставляется «как есть», без гарантий.</p>' },
    { title: 'Ответственность', body: '<ul><li>Ответственность за законность загружаемых файлов — на пользователе.</li></ul>' },
    { title: 'Интеллектуальная собственность', body: '<p>Код и дизайн принадлежат автору. Сгенерированные скайбоксы — ваша собственность.</p>' },

function buildPrivacyHtml() { const sec = PRIVACY_SECTIONS[LANG.current] || PRIVACY_SECTIONS.en; return sec.map((s, i) => `<div class="sheet-section privacy-section${i === 0 ? ' first' : ''}"><h3><i class="bi bi-shield-lock-fill"></i> ${s.title}</h3>${s.body}</div>`).join(''); }
function buildTermsHtml() { const sec = TERMS_SECTIONS[LANG.current] || TERMS_SECTIONS.en; return sec.map((s, i) => `<div class="sheet-section terms-section${i === 0 ? ' first' : ''}"><h3><i class="bi bi-file-earmark-text-fill"></i> ${s.title}</h3>${s.body}</div>`).join(''); }
function buildAboutHtml() {
  const rows = [
    { icon: 'bi-globe2', label: LANG.t('aboutVersionLabel'), value: 'Skybox Studio v1.0' },
    { icon: 'bi-cpu-fill', label: LANG.t('aboutEngineLabel'), value: 'Three.js r160 · WebGL2' },
    { icon: 'bi-person-fill', label: LANG.t('aboutAuthorLabel'), value: LANG.t('author') },
    { icon: 'bi-info-circle-fill', label: LANG.t('aboutDescLabel'), value: LANG.t('aboutDesc') },
  ];
  return `<div class="about-compact">${rows.map(r => `<div class="about-row"><div class="ar-icon"><i class="bi ${r.icon}"></i></div><div class="ar-body"><div class="ar-label">${r.label}</div><div class="ar-value">${r.value}</div></div></div>`).join('')}</div>`;
}
function buildLinksHtml() {
  const links = [
    { icon: 'bi-github', name: 'GitHub', handle: '@Overpowerfulered', href: 'https://github.com/Overpowerfulered' },
    { icon: 'bi-discord', name: 'Discord', handle: 'discord.gg/xwkcgU2Vdj', href: 'https://discord.gg/xwkcgU2Vdj' },
    { icon: 'bi-envelope-fill', name: 'Email', handle: 'overpowerfulered@gmail.com', href: 'mailto:overpowerfulered@gmail.com' },

  return `<div class="links-grid">${links.map(l => `<a href="${l.href}" target="_blank" rel="noopener"><i class="bi ${l.icon}"></i><div class="lg-body"><div class="lg-name">${l.name}</div><div class="lg-handle">${l.handle}</div></div></a>`).join('')}</div>`;
}
function buildHelpBody() {
  const sections = [
    { icon: 'bi-info-circle-fill', title: 'helpIntroTitle', body: 'helpIntroBody' },
    { icon: 'bi-camera', title: 'helpLoadTitle', body: 'helpLoadBody' },
    { icon: 'bi-arrows-move', title: 'helpCameraTitle', body: 'helpCameraBody' },
    { icon: 'bi-palette2', title: 'helpPresetTitle', body: 'helpPresetBody' },
    { icon: 'bi-brightness-high-fill', title: 'helpSunTitle', body: 'helpSunBody' },
    { icon: 'bi-clouds-fill', title: 'helpCloudsTitle', body: 'helpCloudsBody' },
    { icon: 'bi-stars', title: 'helpStarsTitle', body: 'helpStarsBody' },
    { icon: 'bi-activity', title: 'helpAuroraTitle', body: 'helpAuroraBody' },
    { icon: 'bi-border-bottom', title: 'helpHorizonTitle', body: 'helpHorizonBody' },
    { icon: 'bi-camera-reels', title: 'helpProjectionTitle', body: 'helpProjectionBody' },
    { icon: 'bi-grid-3x3', title: 'helpGridTitle', body: 'helpGridBody' },
    { icon: 'bi-house-door', title: 'helpSceneryTitle', body: 'helpSceneryBody' },
    { icon: 'bi-box-arrow-up', title: 'helpExportTitle', body: 'helpExportBody' },
    { icon: 'bi-keyboard', title: 'helpHotkeysTitle', body: 'helpHotkeysBody' },
  ];
  return sections.map((s, i) => `<div class="sheet-section${i === 0 ? ' first' : ''}"><h3><i class="bi ${s.icon}"></i> ${LANG.t(s.title)}</h3><p>${LANG.t(s.body)}</p></div>`).join('');
}
function buildPillGroupHtml(items, activeIdx, dataAttr) {
  const safe = Math.max(0, activeIdx);
  const btns = items.map((it, i) => `<button ${dataAttr}="${it.value}" class="${i === safe ? 'active' : ''}">${it.label}</button>`).join('');
  const count = items.length;
  return `<div class="pill-group"><div class="pill-indicator" style="transform:translateX(${safe * 100}%); width:calc(${100 / count}% - ${(count - 1) * 6 / count}px)"></div>${btns}</div>`;
}
function bindPillGroup(container, dataAttr, onChange) {
  container.querySelectorAll('.pill-group').forEach(g => {
    const btns = Array.from(g.querySelectorAll(`[${dataAttr}]`)); if (!btns.length) return;
    const ind = g.querySelector('.pill-indicator');
    btns.forEach((b, i) => {
      b.addEventListener('click', () => {
        if (b.classList.contains('active')) return;
        btns.forEach(x => x.classList.remove('active')); b.classList.add('active');
        if (ind) { ind.style.width = `calc(${100 / btns.length}% - ${(btns.length - 1) * 6 / btns.length}px)`; ind.style.transform = `translateX(${i * 100}%)`; }
        onChange(b.getAttribute(dataAttr));
      });
    });
  });
}
function buildSettingsBodyHtml() {
  const langItems = [{ value: 'ru', label: '🇷🇺 Русский' }, { value: 'en', label: '🇬🇧 English' }];
  const themeItems = [
    { value: 'light', label: `<i class="bi bi-sun-fill"></i> ${LANG.t('themeLightLabel')}` },
    { value: 'dark', label: `<i class="bi bi-moon-fill"></i> ${LANG.t('themeDarkLabel')}` },
    { value: 'system', label: `<i class="bi bi-display"></i> ${LANG.t('themeSystemLabel')}` },
  ];
  const langIdx = Math.max(0, langItems.findIndex(x => x.value === LANG.current));
  const themeIdx = Math.max(0, themeItems.findIndex(x => x.value === THEME.mode));
  return `
    <div class="settings-section first"><div class="settings-label"><i class="bi bi-translate"></i> ${LANG.t('langSectionTitle')}</div>${buildPillGroupHtml(langItems, langIdx, 'data-lang')}</div>
    <div class="settings-section"><div class="settings-label"><i class="bi bi-palette-fill"></i> ${LANG.t('themeSectionTitle')}</div>${buildPillGroupHtml(themeItems, themeIdx, 'data-theme')}</div>
    <div class="settings-section"><div class="settings-label"><i class="bi bi-info-circle-fill"></i> ${LANG.t('aboutTitle')}</div>${buildAboutHtml()}</div>
    <div class="settings-section"><div class="settings-label"><i class="bi bi-link-45deg"></i> ${LANG.t('linksTitle')}</div>${buildLinksHtml()}</div>
    <div class="settings-section"><div class="settings-label"><i class="bi bi-file-earmark-text-fill"></i> ${LANG.t('legalTitle')}</div><button class="settings-link" id="openLegalBtn" type="button"><i class="bi bi-file-earmark-text-fill"></i><span>${LANG.t('legalTitle')}</span><i class="bi bi-chevron-right"></i></button></div>`;
}
function bindSettingsBody(container) {
  bindPillGroup(container, 'data-lang', val => applyLanguage(val));
  bindPillGroup(container, 'data-theme', val => { THEME.apply(val); saveState(); });
  const legalBtn = container.querySelector('#openLegalBtn');
  if (legalBtn) legalBtn.addEventListener('click', () => showLegalSubView());
}
function showLegalSubView() { if (!SHEET.body) return; SHEET.body.innerHTML = buildLegalTabsHtml(); bindLegalTabs(SHEET.body); SHEET.body.scrollTop = 0; }
function buildLegalTabsHtml() {
  return `<div class="legal-view"><div class="legal-tabs" id="legalTabs"><div class="legal-tabs-indicator" id="legalTabsIndicator" style="transform:translateX(0)"></div><button class="legal-tab active" data-legal-tab="privacy"><i class="bi bi-shield-lock-fill"></i> <span>${LANG.t('privacyTitle')}</span></button><button class="legal-tab" data-legal-tab="terms"><i class="bi bi-file-earmark-text-fill"></i> <span>${LANG.t('termsTitle')}</span></button></div><div class="legal-pane active" data-legal-pane="privacy">${buildPrivacyHtml()}</div><div class="legal-pane" data-legal-pane="terms">${buildTermsHtml()}</div></div>`;
}
function bindLegalTabs(container) {
  const tabs = Array.from(container.querySelectorAll('[data-legal-tab]'));
  const panes = Array.from(container.querySelectorAll('[data-legal-pane]'));
  const ind = container.querySelector('#legalTabsIndicator'); if (!tabs.length) return;
  tabs.forEach((tab, i) => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active')); tab.classList.add('active');
      const key = tab.getAttribute('data-legal-tab');
      panes.forEach(p => p.classList.toggle('active', p.getAttribute('data-legal-pane') === key));
      if (ind) ind.style.transform = `translateX(${i * 100}%)`;
      SHEET.body.scrollTop = 0;
    });
  });
}
function openSettingsSheet() { openSheet('settings', { title: LANG.t('settings'), icon: 'bi bi-sliders', body: buildSettingsBodyHtml(), showClose: true, showAccept: false, afterRender: bindSettingsBody }); }
function openHelpSheet() { openSheet('help', { title: LANG.t('helpTitle'), icon: 'bi bi-question-circle-fill', body: buildHelpBody(), showClose: true, showAccept: false }); }
function openLegalPrivacyStep() { openSheet('legal-privacy', { title: LANG.t('privacyTitle'), icon: 'bi bi-shield-lock-fill legal-icon', body: buildPrivacyHtml(), showClose: false, showAccept: true, acceptLabel: LANG.t('modalNext'), acceptCooldown: 3000, meta: LANG.t('legalGateInfo'), onAccept: () => setTimeout(() => openLegalTermsStep(), 200) }); }
function openLegalTermsStep() { openSheet('legal-terms', { title: LANG.t('termsTitle'), icon: 'bi bi-file-earmark-text-fill legal-icon', body: buildTermsHtml(), showClose: false, showAccept: true, acceptLabel: LANG.t('modalAcceptLegal'), acceptCooldown: 3000, meta: LANG.t('legalGateInfo'), onAccept: () => { setAck('skybox_legal_ack'); setTimeout(() => openCookiesSheet(), 250); } }); }
function openCookiesSheet() { if (hasAck('skybox_cookies_ack')) return; openSheet('cookies', { title: LANG.t('noticeCookiesTitle'), icon: 'bi bi-cookie legal-icon', body: `<div class="sheet-section first"><p>${LANG.t('noticeCookiesBody')}</p></div>`, showClose: false, showAccept: true, showCancel: true, acceptLabel: LANG.t('noticeCookiesOk'), cancelLabel: LANG.t('noticeCookiesDecline'), acceptCooldown: 2000, meta: LANG.t('legalGateInfo'), onAccept: () => setAck('skybox_cookies_ack'), onCancel: () => setAck('skybox_cookies_ack') }); }
function openConfirmSheet() { openSheet('confirm', { title: LANG.t('confirmTitle'), icon: 'bi bi-trash3-fill confirm-icon', body: `<div class="sheet-section first"><p>${LANG.t('confirmText')}</p></div>`, showClose: true, showAccept: true, showCancel: true, acceptLabel: LANG.t('confirmOk'), cancelLabel: LANG.t('confirmCancel'), compact: true, acceptCooldown: 4000, onAccept: () => performResetAll() }); }

const history = {
  stack: [], index: -1, max: 40,
  push(snap) { this.stack = this.stack.slice(0, this.index + 1); this.stack.push(snap); if (this.stack.length > this.max) this.stack.shift(); this.index = this.stack.length - 1; updateHistoryButtons(); },
  undo() { if (this.index <= 0) return null; this.index--; updateHistoryButtons(); return this.stack[this.index]; },
  redo() { if (this.index >= this.stack.length - 1) return null; this.index++; updateHistoryButtons(); return this.stack[this.index]; },
  canUndo() { return this.index > 0; }, canRedo() { return this.index < this.stack.length - 1; },
};
let pushHistoryTimer = null;
function pushHistory() { if (pushHistoryTimer) clearTimeout(pushHistoryTimer); pushHistoryTimer = setTimeout(() => { pushHistoryTimer = null; history.push(JSON.parse(JSON.stringify(state))); }, 250); }
function updateHistoryButtons() { undoBtn.disabled = !history.canUndo(); redoBtn.disabled = !history.canRedo(); }
function resetHistory() { if (pushHistoryTimer) { clearTimeout(pushHistoryTimer); pushHistoryTimer = null; } history.stack = []; history.index = -1; history.push(JSON.parse(JSON.stringify(state))); updateHistoryButtons(); }
undoBtn.addEventListener('click', () => { const s = history.undo(); if (s) { Object.assign(state, s); applyStateToUniforms(); applyGridAndGround(); applyScenery(); saveState(); invalidateCubePreview(); invalidatePresetPreviews(); updateLayerPreviews(); renderLayers(); showToast(LANG.t('toastUndo')); } });
redoBtn.addEventListener('click', () => { const s = history.redo(); if (s) { Object.assign(state, s); applyStateToUniforms(); applyGridAndGround(); applyScenery(); saveState(); invalidateCubePreview(); invalidatePresetPreviews(); updateLayerPreviews(); renderLayers(); showToast(LANG.t('toastRedo')); } });
resetAllBtn.addEventListener('click', openConfirmSheet);
function performResetAll() {
  Object.assign(state, DEFAULT_STATE);
  if (u.uPanorama.value && !u.uPanorama.value.isDataTexture) { try { u.uPanorama.value.dispose(); } catch (_) {} }
  u.uPanorama.value = makeEmptyTexture(); u.uUsePanorama.value = 0;
  applyStateToUniforms(); buildGridAndGround(); applyGridAndGround(); applyScenery();
  saveState(); invalidateCubePreview(); invalidatePresetPreviews(); updateLayerPreviews(); resetHistory();
  showToast(LANG.t('toastReset'));
}
resetCamBtn.addEventListener('click', () => { camera.position.set(0, 0, 3); controls.target.set(0, 0, 0); controls.update(); updateCoordsInputs(); showToast(LANG.t('toastCamReset')); });

function takeScreenshot() {
  const hidden = [];
  ['.top-bar', '.left-top-group', '.layers-container', '.center-actions-row', '.swipe-hint', '.left-stack', '.right-stack', '.bottom-bar-outer', '.toast-custom', '.loading-overlay', '.layer-zoom-overlay', '.sheet-overlay', '.slider-popover'].forEach(sel => {
    document.querySelectorAll(sel).forEach(el => { if (el.style.visibility !== 'hidden') { hidden.push({ el, prev: el.style.visibility }); el.style.visibility = 'hidden'; } });
  });
  requestAnimationFrame(() => {
    try {
      renderer.render(scene, camera);
      const a = document.createElement('a');
      a.download = `${filenameBase()}_screenshot.png`; a.href = renderer.domElement.toDataURL('image/png');
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      showToast(LANG.t('toastScreenshot'));
    } catch (e) { console.error(e); showToast(LANG.t('toastError'), true); }
    finally { hidden.forEach(({ el, prev }) => { el.style.visibility = prev || ''; }); }
  });
}
screenshotBtn.addEventListener('click', takeScreenshot);

function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight; if (w === 0 || h === 0) return;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  const gw = gizmoEl.clientWidth || 54; gizmoRenderer.setSize(gw, gw);
  updateZoomThumbPosition(getZoomPercent());
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

let frameCount = 0, fpsTimer = performance.now(), lastTime = performance.now();
function animate() {
  const now = performance.now(); const dt = Math.min(0.1, (now - lastTime) / 1000); lastTime = now;
  u.uTime.value += dt; controls.update(); renderer.render(scene, camera); renderGizmo();
  frameCount++;
  if (now - fpsTimer >= 800) { fpsBadge.textContent = `FPS ${Math.round(frameCount * 1000 / (now - fpsTimer))}`; frameCount = 0; fpsTimer = now; }
  requestAnimationFrame(animate);
}

function applyLanguage(lang) {
  LANG.current = lang; document.documentElement.lang = lang; saveLang(lang);
  const brandLink = $('brandSubLink'); if (brandLink) brandLink.textContent = LANG.t('author');
  $('posLabel').textContent = LANG.t('posLabel'); $('resetCamBtn').textContent = LANG.t('posReset');
  layersLabel.textContent = LANG.t('layers');
  swipeHint.innerHTML = `<i class="bi bi-arrows-move"></i> ${LANG.t('swipeHint')}`;
  if (SHEET.overlay && SHEET.overlay.classList.contains('show')) {
    if (SHEET.currentKey === 'settings') { SHEET.body.innerHTML = buildSettingsBodyHtml(); bindSettingsBody(SHEET.body); }
    else if (SHEET.currentKey === 'help') SHEET.body.innerHTML = buildHelpBody();
  }
  if (activeTool && activeAnchorBtn) { const btn = activeAnchorBtn; closeActivePopover(); openPopoverFor(btn); }
  updateLayerPreviews();
}

function boot() {
  if (!initSheet()) { showToast('UI init failed', true); return; }
  try { const savedTheme = safeStorage.get('skybox_theme'); THEME.apply(savedTheme || 'system'); } catch (_) { THEME.apply('system'); }
  applyLanguage(detectLang());
  applyStateToUniforms(); buildGridAndGround(); applyGridAndGround(); applyScenery();
  resize(); setZoomPercent(50); updateCoordsInputs(); resetHistory();
  settingsBtn.addEventListener('click', openSettingsSheet);
  helpBtn.addEventListener('click', openHelpSheet);

  document.addEventListener('keydown', e => {
    if (SHEET.overlay && SHEET.overlay.classList.contains('show') && SHEET.closeLocked) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); } return; }
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') { if (e.key === 'Escape') e.target.blur(); return; }
    const meta = e.ctrlKey || e.metaKey;
    if (meta && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) { e.preventDefault(); undoBtn.click(); }
    else if (meta && ((e.key === 'y' || e.key === 'Y') || ((e.key === 'z' || e.key === 'Z') && e.shiftKey))) { e.preventDefault(); redoBtn.click(); }
    else if (e.key === 'Escape') {
      if (layerZoomOverlay.classList.contains('show')) layerZoomOverlay.classList.remove('show');
      else if (activeTool) closeActivePopover();
      else if (SHEET.overlay && SHEET.overlay.classList.contains('show') && !SHEET.closeLocked) closeSheet();
    }
  });

  if (!hasAck('skybox_legal_ack')) setTimeout(() => openLegalPrivacyStep(), 500);
  else if (!hasAck('skybox_cookies_ack')) setTimeout(() => openCookiesSheet(), 600);

  setTimeout(() => { resize(); updateZoomThumbPosition(getZoomPercent()); updateLayerPreviews(); }, 200);
  animate();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
