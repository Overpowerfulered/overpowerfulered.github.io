/* ---------- Reset / Base ---------- */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  --pop-tile-bg-hover: rgba(255, 255, 255, 0.14);

/* ---------- Left position group ---------- */
.left-top-group { position: absolute; top: var(--top-anchor); left: var(--grid-pad); z-index: 18; display: flex; flex-direction: column; pointer-events: none; width: var(--pos-block-w); max-width: calc(50vw - var(--grid-pad) * 2); }

/* ---------- Layers ---------- */

.center-actions-row { position: absolute; top: calc(var(--top-anchor) + 20px + var(--tile-base) + var(--grid-gap) + 8px); left: var(--grid-pad); right: var(--grid-pad); z-index: 18; height: var(--bottom-btn); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; pointer-events: none; }

.screenshot-btn-left:hover { color: var(--ui-icon-color-hover); background: var(--active-highlight); }
.bottom-center { flex: 1; display: flex; justify-content: center; min-width: 0; align-items: flex-end; }
.bottom-strip { display: flex; align-items: center; gap: 4px; background: var(--ui-strip); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-radius: calc(var(--bottom-btn) / 2 + 6px); padding: 6px; box-shadow: var(--ui-strip-shadow); border: 1px solid var(--ui-strip-border); color: var(--ui-text-on-strip); }
.tool-btn { width: var(--bottom-btn); height: var(--bottom-btn); border-radius: 50%; border: none; background: transparent; color: var(--ui-icon-color); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: var(--icon-size-md); transition: background 0.15s, color 0.15s; position: relative; flex-shrink: 0; padding: 0; }
.tool-btn:hover { color: var(--ui-icon-color-hover); }
.tool-btn .badge-val { position: absolute; bottom: 4px; right: 5px; background: rgba(99, 102, 241, 0.35); color: var(--ui-text-on-strip); font-size: var(--ui-fs-tiny); font-weight: 700; padding: 1px 5px; border-radius: 6px; font-family: 'SF Mono', ui-monospace, monospace; min-width: 18px; text-align: center; line-height: 1.2; pointer-events: none; }
body.theme-light .tool-btn .badge-val { color: #fff; background: rgba(99, 102, 241, 0.85); }
.tool-sep { width: 1px; height: calc(var(--bottom-btn) * 0.55); background: var(--ui-strip-border); margin: 0 3px; flex-shrink: 0; }
.tool-download { color: var(--ui-success); }
.tool-download:disabled { opacity: 0.4; cursor: not-allowed; }
.tool-upload { background: var(--ui-accent); color: #fff !important; }
.bottom-right-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; pointer-events: auto; }
.settings-btn-bottom { width: var(--bottom-btn); height: var(--bottom-btn); border-radius: 50%; border: none; background: transparent; color: var(--ui-icon-color); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: var(--icon-size-md); transition: color 0.15s, background 0.15s; flex-shrink: 0; padding: 0; outline: none; }
.settings-btn-bottom:hover { color: var(--ui-icon-color-hover); background: var(--active-highlight); }

/* ---------- Sheet ---------- */
.sheet-overlay { position: fixed; inset: 0; z-index: 290; display: flex; align-items: center; justify-content: center; padding: calc(var(--top-anchor) + 12px) var(--grid-pad) calc(var(--bottom-anchor) + 12px); background: rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.22s; }
.sheet-overlay.show { opacity: 1; pointer-events: auto; }
.sheet-panel { background: var(--pop-bg); color: var(--pop-text); border: 1px solid var(--pop-border); border-radius: 20px; width: 100%; max-width: 520px; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); transform: translateY(12px) scale(0.98); opacity: 0; transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.22s; overflow: hidden; will-change: transform, opacity; max-height: 100%; height: auto; }
.sheet-panel.sheet-compact { max-width: 420px; }
.sheet-overlay.show .sheet-panel { transform: translateY(0) scale(1); opacity: 1; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; border-bottom: 1px solid var(--ui-divider); flex-shrink: 0; gap: 10px; }
.sheet-header h2 { font-size: 14px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 9px; letter-spacing: -0.2px; min-width: 0; line-height: 1.25; color: var(--pop-text); }
.sheet-header h2 span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-header h2 i { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.sheet-header h2 i.legal-icon { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.sheet-header h2 i.confirm-icon { background: linear-gradient(135deg, #ef4444, #f59e0b); }
.sheet-close { width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent; color: var(--pop-text); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; position: relative; padding: 0; }
.sheet-close:hover { background: var(--pop-btn-bg); }
.sheet-close.hidden { display: none !important; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px 16px; font-size: 12.5px; line-height: 1.5; color: var(--pop-tile-text); min-height: 0; overscroll-behavior: contain; user-select: text; -webkit-user-select: text; }
.sheet-body::-webkit-scrollbar { width: 6px; }
.sheet-body::-webkit-scrollbar-thumb { background: var(--pop-track); border-radius: 3px; }
.sheet-body.loading .sheet-skeleton { display: block; }
.sheet-body.loading > :not(.sheet-skeleton) { display: none; }
.sheet-skeleton { display: none; }
.sheet-skeleton .skeleton-line { height: 12px; width: 100%; margin: 8px 0; border-radius: 6px; }
.sheet-skeleton .skeleton-line.short { width: 62%; }
.sheet-skeleton .skeleton-line.medium { width: 82%; }
.sheet-skeleton .skeleton-block { border-radius: 10px; height: 44px; margin-bottom: 8px; }
.sheet-footer { padding: 10px 14px; border-top: 1px solid var(--ui-divider); font-size: 11.5px; color: var(--pop-title-color); flex-shrink: 0; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.sheet-footer.hidden { display: none; }
.sheet-footer .sheet-btn { padding: 9px 16px; border-radius: 10px; border: none; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s, opacity 0.15s; position: relative; overflow: hidden; }
.sheet-footer .sheet-btn.cancel { background: var(--modal-cancel-bg); color: var(--modal-cancel-color); }
.sheet-footer .sheet-btn.cancel:hover { background: var(--modal-cancel-hover); }
.sheet-footer .sheet-btn.accept { background: var(--ui-accent); color: #fff; }
.sheet-footer .sheet-btn.accept:hover { background: var(--ui-accent-hover); }
.sheet-footer .sheet-btn.accept:disabled { opacity: 0.55; cursor: not-allowed; }
.sheet-footer .sheet-btn .btn-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(0, 0, 0, 0.2); pointer-events: none; }
.sheet-footer .sheet-btn .btn-progress .fill { height: 100%; background: rgba(255, 255, 255, 0.55); transition: width 0.1s linear; }
.sheet-footer .sheet-meta { margin-right: auto; color: var(--pop-title-color); font-size: 11px; }

/* ---------- Sheet sections ---------- */
.sheet-section { padding: 10px 0; }
.sheet-section + .sheet-section { border-top: 1px solid var(--ui-divider); }
.sheet-section h3 { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--pop-title-color); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.sheet-section h3 i { color: var(--pop-accent); font-size: 12px; }
.sheet-section.privacy-section h3 i { color: #10b981; }
.sheet-section.terms-section h3 i { color: #8b5cf6; }
.sheet-section p { margin: 0 0 6px; font-size: 12px; line-height: 1.55; }
.sheet-section p:last-child { margin-bottom: 0; }
.sheet-section ul { margin: 0 0 6px; padding-left: 18px; }
.sheet-section li { margin-bottom: 4px; font-size: 12px; line-height: 1.5; }
.sheet-section strong { color: var(--pop-text); }
.sheet-section code { background: var(--pop-btn-bg); padding: 1px 5px; border-radius: 4px; font-family: 'SF Mono', ui-monospace, monospace; font-size: 11px; font-weight: 600; color: var(--pop-accent-soft); }
.sheet-section a { color: var(--pop-accent-soft); }

/* ---------- About / Links ---------- */
.about-compact { display: flex; flex-direction: column; gap: 6px; }
.about-compact .about-row { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 9px; background: var(--pop-btn-bg); font-size: 12px; }
.about-compact .about-row .ar-icon { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: rgba(99, 102, 241, 0.15); color: var(--pop-accent); font-size: 12px; flex-shrink: 0; }
.about-compact .about-row .ar-body { flex: 1; min-width: 0; }
.about-compact .about-row .ar-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--pop-title-color); line-height: 1.2; }
.about-compact .about-row .ar-value { font-size: 12px; font-weight: 600; color: var(--pop-text); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.links-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.links-grid a { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; background: var(--pop-btn-bg); color: var(--pop-text); text-decoration: none; transition: background 0.15s; font-size: 11.5px; font-weight: 600; }
.links-grid a:hover { background: var(--pop-tile-bg-hover); }
.links-grid a i:first-child { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: rgba(99, 102, 241, 0.15); color: var(--pop-accent); font-size: 13px; flex-shrink: 0; }
.links-grid a .lg-body { flex: 1; min-width: 0; }
.links-grid a .lg-name { font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.links-grid a .lg-handle { font-size: 9.5px; color: var(--pop-title-color); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) { .links-grid { grid-template-columns: 1fr; } }

/* ---------- Settings ---------- */
.settings-section { padding: 10px 0; }
.settings-section + .settings-section { border-top: 1px solid var(--ui-divider); }
.settings-section.first { padding-top: 4px; }
.settings-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--pop-title-color); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.settings-label i { color: var(--pop-accent); font-size: 12px; }
.settings-link { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 10px; background: var(--pop-btn-bg); color: var(--pop-text); font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; font-family: inherit; width: 100%; text-align: left; transition: background 0.15s; }
.settings-link:hover { background: var(--pop-tile-bg-hover); }
.settings-link i:first-child { color: var(--pop-accent); font-size: 14px; width: 16px; text-align: center; }
.settings-link i:last-child { color: var(--pop-title-color); font-size: 12px; margin-left: auto; }

/* ---------- Pill groups ---------- */
.pill-group { position: relative; display: flex; background: var(--pop-btn-bg); border-radius: 12px; padding: 3px; gap: 0; isolation: isolate; }
.pill-indicator { position: absolute; top: 3px; bottom: 3px; left: 3px; background: var(--ui-accent); border-radius: 9px; z-index: 0; transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), width 0.32s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; will-change: transform, width; }
.pill-group button { flex: 1; padding: 9px 6px; border: none; background: transparent; color: var(--pop-tile-text); font-size: 12px; font-weight: 600; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-family: inherit; min-height: 36px; transition: color 0.22s; position: relative; z-index: 1; white-space: nowrap; }
.pill-group button i { font-size: 13px; }
.pill-group button.active { color: #fff; }

/* ---------- Legal tabs ---------- */
.legal-view { display: flex; flex-direction: column; }
.legal-tabs { position: relative; display: flex; background: var(--pop-btn-bg); border-radius: 12px; padding: 3px; margin-bottom: 12px; flex-shrink: 0; isolation: isolate; }
.legal-tabs-indicator { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--ui-accent); border-radius: 9px; z-index: 0; transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
.legal-tab { flex: 1; padding: 9px 12px; border: none; background: transparent; color: var(--pop-tile-text); font-family: inherit; font-size: 12px; font-weight: 600; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: color 0.22s; white-space: nowrap; min-width: 0; position: relative; z-index: 1; }
.legal-tab span { overflow: hidden; text-overflow: ellipsis; }
.legal-tab i { font-size: 12px; flex-shrink: 0; }
.legal-tab.active { color: #fff; }
.legal-pane { display: none; }
.legal-pane.active { display: block; }

/* ---------- Tile preview ---------- */
.tile-compact { display: flex; flex-direction: column; gap: 8px; }
.tile-preview-wrap { width: 100%; aspect-ratio: 1 / 1; max-height: 32vh; background: rgba(0, 0, 0, 0.3); border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--ui-divider); }
.tile-preview-wrap canvas { display: block; max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }
.tile-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; background: var(--pop-btn-bg); border-radius: 10px; }
.tile-row label { font-size: 11.5px; font-weight: 600; color: var(--pop-text); display: flex; align-items: center; gap: 6px; min-width: 80px; }
.tile-row input[type="range"] { flex: 1; accent-color: var(--ui-accent); min-width: 0; }
.tile-row .tile-val { font-family: 'SF Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 700; color: var(--pop-accent-soft); min-width: 38px; text-align: right; }
.tile-row input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--ui-accent); justify-self: end; }
.tile-hint { font-size: 11px; line-height: 1.4; color: var(--pop-title-color); padding: 6px 8px; border-radius: 8px; background: var(--pop-btn-bg); }
.tile-actions-row { display: flex; gap: 6px; }
.tile-actions-row .tile-btn { flex: 1; padding: 10px 12px; border-radius: 10px; border: none; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tile-actions-row .tile-btn.primary { background: var(--ui-accent); color: #fff; }
.tile-actions-row .tile-btn.primary:hover { background: var(--ui-accent-hover); }
.tile-actions-row .tile-btn.ghost { background: var(--pop-btn-bg); color: var(--pop-text); }
.tile-actions-row .tile-btn.ghost:hover { background: var(--pop-tile-bg-hover); }

/* ============================================================
   Popovers — compact tuning (v1.0)
   Объект в центре не перекрывается. Все контролы ужаты.
   ============================================================ */
.slider-popover {
  position: fixed; left: 50%;
  transform: translateX(-50%) translateY(8px) scale(0.97);
  bottom: calc(var(--bottom-anchor) + 8px);
  top: calc(var(--top-anchor) + 8px);
  margin-top: auto; margin-bottom: 0;
  background: var(--pop-bg);
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border-radius: 14px;
  padding: 8px 10px;
  border: 1px solid var(--pop-border);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  z-index: 100;
  width: max-content;
  min-width: 200px;
  max-width: min(calc(100vw - 32px), 320px);
  height: fit-content;
  max-height: calc(100vh - var(--top-anchor) - var(--bottom-anchor) - 20px);
  overflow-y: auto;
  overflow-x: hidden;
  color: var(--pop-text);
  opacity: 0;
  transform-origin: bottom center;
  pointer-events: none;
  transition: opacity 0.16s, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  scrollbar-width: thin;
  scrollbar-color: var(--pop-track) transparent;
  font-size: 12px;
}
.slider-popover::-webkit-scrollbar { width: 5px; }
.slider-popover::-webkit-scrollbar-thumb { background: var(--pop-track); border-radius: 3px; }
.slider-popover.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
.slider-popover .pop-title { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--pop-title-color); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; position: relative; padding-right: 22px; }
.slider-popover .pop-title i.bi { color: var(--pop-accent); font-size: 12px; }
.slider-popover .pop-title > span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slider-popover .pop-close { position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; border: none; background: transparent; color: var(--pop-title-color); display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; transition: background 0.15s, color 0.15s; padding: 0; }
.slider-popover .pop-close:hover { background: var(--pop-btn-bg); color: var(--pop-text); }
.pop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pop-row:last-child { margin-bottom: 0; }
.pop-lbl { font-size: 11px; font-weight: 600; color: var(--pop-tile-text); min-width: 56px; flex-shrink: 0; }
.slider-popover input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 5px; background: var(--pop-track); border-radius: 3px; outline: none; touch-action: pan-y; min-width: 60px; }
.slider-popover input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: var(--pop-thumb); border-radius: 50%; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); cursor: pointer; border: none; }
.slider-popover input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; background: var(--pop-thumb); border-radius: 50%; border: none; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); cursor: pointer; }
.slider-popover .pop-val-input { font-family: 'SF Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; color: var(--pop-accent-soft); min-width: 44px; max-width: 54px; text-align: right; background: transparent; border: none; outline: none; padding: 2px 0; -moz-appearance: textfield; }
.slider-popover .pop-val-input::-webkit-outer-spin-button, .slider-popover .pop-val-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.slider-popover input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--ui-accent); margin-left: auto; flex-shrink: 0; }
.slider-popover input[type="color"] { flex: 1; height: 24px; min-width: 50px; border-radius: 6px; border: 1px solid var(--pop-border); cursor: pointer; background: transparent; padding: 1px; }
.slider-popover input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.slider-popover input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
.slider-popover input[type="color"]::-moz-color-swatch { border: none; border-radius: 4px; }

/* ---------- Preview grids ---------- */
.preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; max-height: 38vh; overflow-y: auto; padding: 2px 0; }
.preview-grid button { padding: 0; border: 2px solid transparent; background: var(--pop-tile-bg); color: var(--pop-tile-text); font-size: 9.5px; font-weight: 600; border-radius: 9px; cursor: pointer; transition: background 0.15s, border-color 0.15s; display: flex; flex-direction: column; align-items: stretch; font-family: inherit; overflow: hidden; }
.preview-grid button .pv-img { width: 100%; aspect-ratio: 1 / 1; background-size: cover !important; background-position: center !important; background-color: rgba(0, 0, 0, 0.2); flex-shrink: 0; overflow: hidden; display: block; }
.preview-grid button .pv-label { display: block; padding: 4px 3px; text-align: center; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9.5px; }
.preview-grid button.active { background: var(--pop-tile-active); border-color: var(--ui-accent); color: var(--pop-text); }
.preview-grid button:disabled { opacity: 0.35; cursor: not-allowed; }

/* ---------- Pop-grid / gl ---------- */
.pop-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.pop-grid button { padding: 7px 4px; border-radius: 9px; border: 1px solid transparent; background: var(--pop-tile-bg); color: var(--pop-tile-text); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 10px; font-weight: 600; transition: background 0.15s, border-color 0.15s, color 0.15s; }
.pop-grid button:hover { background: var(--pop-tile-bg-hover); }
.pop-grid button.active { background: var(--pop-tile-active); border-color: var(--ui-accent); color: var(--pop-text); }
.pop-grid button i { font-size: 15px; color: var(--pop-accent); }
.pop-grid button.active i { color: var(--pop-text); }
.pop-grid button .gl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* ---------- Reset-button ---------- */
.pop-reset-btn { display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; padding: 7px 10px; border-radius: 8px; border: none; background: var(--pop-btn-bg); color: var(--pop-text); cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600; transition: background 0.15s; }
.pop-reset-btn:hover { background: var(--pop-tile-bg-hover); }
.pop-reset-btn i { font-size: 11px; color: var(--pop-accent); }
.pop-reset-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--pop-border); }

/* ---------- Custom editors ---------- */
.custom-editor { display: none; }
.custom-editor.show { display: block; }
.custom-editor .custom-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.custom-editor .custom-row:last-child { margin-bottom: 0; }
.custom-editor .custom-lbl { font-size: 10.5px; font-weight: 600; color: var(--pop-tile-text); min-width: 64px; flex-shrink: 0; }
.custom-editor .custom-val { font-family: 'SF Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 700; color: var(--pop-accent-soft); min-width: 36px; max-width: 48px; text-align: right; background: transparent; border: none; outline: none; -moz-appearance: textfield; }
.custom-editor .custom-val::-webkit-outer-spin-button, .custom-editor .custom-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.custom-back-row { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--pop-border); }

};

function disposeUnique(...args) {
  const seen = new Set();
  const walk = (item) => {
    if (item == null) return;
    if (Array.isArray(item)) { item.forEach(walk); return; }
    if (item.isTexture) { if (!seen.has(item)) { seen.add(item); try { item.dispose(); } catch (e) {} } }
    else if (item.isMaterial) disposeMaterial(item);
    else if (item.isGeometry) { if (!seen.has(item)) { seen.add(item); try { item.dispose(); } catch (e) {} } }
  };
  args.forEach(walk);
}

function buildPillGroupHtml(items, activeIdx, dataAttr) {

  const buttonsHtml = items.map((item, i) => `<button ${dataAttr}="${item.value}" class="${i === safeIdx ? 'active' : ''}">${item.label}</button>`).join('');

}
function bindPillGroup(container, dataAttr, onChange) {
  container.querySelectorAll('.pill-group').forEach(group => {
    if (!group.querySelector(`[${dataAttr}]`)) return;
    const buttons = Array.from(group.querySelectorAll(`[${dataAttr}]`));
    const indicator = group.querySelector('.pill-indicator');
    buttons.forEach((btn, i) => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) return;
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (indicator) {
          const count = buttons.length;
          indicator.style.width = `calc(${100 / count}% - ${(count - 1) * 6 / count}px)`;
          indicator.style.transform = `translateX(${i * 100}%)`;
        }
        onChange(btn.getAttribute(dataAttr));
      });
    });
  });
}
function updatePillGroupActive(container, dataAttr, value) {
  container.querySelectorAll('.pill-group').forEach(group => {
    const buttons = Array.from(group.querySelectorAll(`[${dataAttr}]`));
    if (!buttons.length) return;
    const indicator = group.querySelector('.pill-indicator');
    let activeIdx = -1;
    buttons.forEach((btn, i) => { const a = btn.getAttribute(dataAttr) === value; btn.classList.toggle('active', a); if (a) activeIdx = i; });
    if (indicator && activeIdx >= 0) {
      const count = buttons.length;
      indicator.style.width = `calc(${100 / count}% - ${(count - 1) * 6 / count}px)`;
      indicator.style.transform = `translateX(${activeIdx * 100}%)`;
    }
  });
}

function bindSliderPair(sliderEl, numberEl, formatFn, applyFn) {
  if (!sliderEl || !numberEl) return;
  const apply = (v) => { applyFn(v); resetHideTimer(); };
  sliderEl.addEventListener('input', () => {
    const v = parseFloat(sliderEl.value);
    numberEl.value = formatFn(v); apply(v);
  });
  sliderEl.addEventListener('change', () => pushHistory());
  numberEl.addEventListener('change', () => {
    const min = parseFloat(sliderEl.min), max = parseFloat(sliderEl.max);
    let v = parseFloat(numberEl.value);
    if (isNaN(v)) v = parseFloat(sliderEl.value);
    v = Math.max(min, Math.min(max, v));
    sliderEl.value = v; numberEl.value = formatFn(v); apply(v); pushHistory();
  });
  numberEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const min = parseFloat(sliderEl.min), max = parseFloat(sliderEl.max);
      let v = parseFloat(numberEl.value);
      if (isNaN(v)) v = parseFloat(sliderEl.value);
      v = Math.max(min, Math.min(max, v));
      sliderEl.value = v; numberEl.value = formatFn(v); apply(v); pushHistory(); numberEl.blur();
    }
  });
  numberEl.addEventListener('focus', (e) => e.stopPropagation());
}

function schedulePreviewFill(el, items, fillFn) {
  const run = () => {
    if (!el.isConnected) return;
    items.forEach((it) => {
      const btn = el.querySelector(`[data-preview-key="${it.key}"]`);
      if (!btn) return;
      const imgEl = btn.querySelector('.pv-img');
      if (!imgEl) return;
      const url = fillFn(it.key);
      if (url) { imgEl.style.backgroundImage = `url('${url}')`; imgEl.classList.remove('skeleton'); }
    });
  };
  if (HAS_IDLE_CALLBACK) requestIdleCallback(run, { timeout: 500 });
  else setTimeout(run, 0);
}

function buildPopover(tool) {
  const el = document.createElement('div');
  el.className = 'slider-popover';
  el.dataset.tool = tool;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'false');
  let bodyHtml = '', titleKey = '', icon = '';
  const isLight = THEME.isLight();

  if (tool === 'shape') {
    const shapeKeys = ['plane', 'cube', 'sphere', 'torus', 'cylinder', 'cone', 'torusKnot', 'capsule'];
    const labels = { plane: 'shapePlane', cube: 'shapeCube', sphere: 'shapeSphere', torus: 'shapeTorus', cylinder: 'shapeCylinder', cone: 'shapeCone', torusKnot: 'shapeTorusKnot', capsule: 'shapeCapsule' };
    const allKeys = [...shapeKeys, 'custom'];
    const btns = allKeys.map(k => {
      const label = k === 'custom' ? LANG.t('shapeCustom') : LANG.t(labels[k]);
      const active = k === 'custom' ? state.currentMeshType === 'custom' : state.currentMeshType === k;
      return `<button data-mesh="${k}" data-preview-key="${k}" class="${active ? 'active' : ''}" title="${label}"><span class="pv-img skeleton"></span><span class="pv-label">${label}</span></button>`;
    }).join('');
    bodyHtml = `<div class="preview-grid" id="shapeGrid">${btns}</div>`;
    titleKey = 'lblShape'; icon = 'bi-shapes';
    setTimeout(() => schedulePreviewFill(el, allKeys.map(k => ({ key: k })), previewShape), 0);
  } else if (tool === 'bg') {
    const presets = [
      { key: 'light', label: 'bgLight' }, { key: 'dark', label: 'bgDark' }, { key: 'studio', label: 'bgStudio' },
      { key: 'sunset', label: 'bgSunset' }, { key: 'ocean', label: 'bgOcean' }, { key: 'forest', label: 'bgForest' },
      { key: 'night', label: 'bgNight' }, { key: 'clouds', label: 'bgClouds' }, { key: 'custom', label: 'bgCustom' },
    ];
    const validBgs = isLight ? LIGHT_THEME_BGS : DARK_THEME_BGS;
    const presetBtns = presets.map(it => {
      const disabled = it.key !== 'custom' && !validBgs.includes(it.key) ? 'disabled' : '';
      return `<button data-bg="${it.key}" data-preview-key="${it.key}" class="${state.currentBgMode === it.key ? 'active' : ''}" ${disabled}><span class="pv-img skeleton"></span><span class="pv-label">${LANG.t(it.label)}</span></button>`;
    }).join('');
    bodyHtml = `<div class="preview-grid" id="bgGrid">${presetBtns}</div><div id="bgEditorWrap" style="display:none">${buildBgAdjustEditor()}</div>`;
    titleKey = 'lblBackground'; icon = 'bi-card-image';

    bodyHtml = `<div class="pop-grid">

function resetHideTimer() {
  if (hideTimer) clearTimeout(hideTimer);

function openPopoverFor(btn) {
  if (!btn) return;
  const tool = btn.dataset.tool; if (!tool) return;
  if (activeTool === tool && activeAnchorBtn === btn) { closeActivePopover(); return; }
  if (SHEET.overlay && SHEET.overlay.classList.contains('show')) {
    if (SHEET.closeLocked) return;
    closeSheet();
  }
  closeActivePopover();
  if (popovers[tool]) { try { popovers[tool].remove(); } catch (e) {} }
  popovers[tool] = buildPopover(tool);
  const pop = popovers[tool];
  pop.classList.add('show');
  btn.classList.add('open');
  activeTool = tool; activePopoverEl = pop; activeAnchorBtn = btn;
  resetHideTimer();
  pop._previousFocus = document.activeElement;
  const closeBtn = pop.querySelector('.pop-close');
  if (closeBtn) closeBtn.focus({ preventScroll: true });
}
function closeActivePopover() {
  if (activePopoverEl) {
    const prev = activePopoverEl._previousFocus;
    if (prev && typeof prev.focus === 'function') { try { prev.focus({ preventScroll: true }); } catch (e) {} }
    activePopoverEl.classList.remove('show');
    const el = activePopoverEl;
    setTimeout(() => { try { el.remove(); } catch (e) {} }, 250);
  }
  if (activeAnchorBtn) activeAnchorBtn.classList.remove('open');
  activeTool = null; activePopoverEl = null; activeAnchorBtn = null;
  if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
}
document.querySelectorAll('[data-tool]').forEach(btn => {

});

function makeSeamlessCanvas(src, strength = 0.5) {
  const w = src.width, h = src.height;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const ctx = out.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0);
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const original = new Uint8ClampedArray(d);
  const radius = Math.max(4, Math.round(Math.min(w, h) * 0.12 * strength));
  const blend = new Uint8ClampedArray(d.length);
  const halfW = Math.floor(w / 2), halfH = Math.floor(h / 2);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const o = (y * w + x) * 4;
      const sx = (x + halfW) % w; const sy = (y + halfH) % h;
      const so = (sy * w + sx) * 4;
      blend[o] = original[so]; blend[o + 1] = original[so + 1]; blend[o + 2] = original[so + 2]; blend[o + 3] = 255;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dxEdge = Math.min(x, w - 1 - x); const dyEdge = Math.min(y, h - 1 - y);
      const edgeDist = Math.min(dxEdge, dyEdge);
      if (edgeDist < radius) {
        const t = Math.min(1, edgeDist / radius);
        const wBlend = 1 - t * t * (3 - 2 * t);
        const o = (y * w + x) * 4;
        d[o] = original[o] * (1 - wBlend) + blend[o] * wBlend;
        d[o + 1] = original[o + 1] * (1 - wBlend) + blend[o + 1] * wBlend;
        d[o + 2] = original[o + 2] * (1 - wBlend) + blend[o + 2] * wBlend;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return out;
}
function renderTilePreview() {
  const canvas = tileState.previewCanvas;
  if (!canvas || !state.originalCanvas) return;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const src = tileState.seamSmooth ? makeSeamlessCanvas(state.originalCanvas, 0.5) : state.originalCanvas;
  const n = tileState.repeat;
  const cellW = W / n, cellH = H / n;
  for (let ty = 0; ty < n; ty++) for (let tx = 0; tx < n; tx++) ctx.drawImage(src, tx * cellW, ty * cellH, cellW, cellH);
}
function applySeamBake() {
  if (!state.originalCanvas) { showToast(LANG.t('tileNotReady'), true); return; }
  const baked = tileState.seamSmooth ? makeSeamlessCanvas(state.originalCanvas, 0.5) : state.originalCanvas;
  state.isSampleTexture = false;
  processSourceCanvas(baked);
  showToast(LANG.t('tileApplied'));
}

      lightPreset: DEFAULT_STATE.lightPreset,
      currentMaterial: THEME.isLight() ? 'ceramic' : DEFAULT_STATE.currentMaterial,
      materialOverrides: { metalness: null, roughness: null, envMapIntensity: null },
      customMaterial: null, customFilter: null,
      rgba: { ...DEFAULT_STATE.rgba },
      bgColor: THEME.isLight() ? { r: 232, g: 236, b: 242 } : { r: 15, g: 16, b: 22 },
      bgTint: { brightness: 100, saturation: 100, hue: 0, blur: 0, gradient: 0 },
      sideSlots: [...DEFAULT_STATE.sideSlots],
      flatZoomHalfH: 2.25,
      gridVisible: DEFAULT_STATE.gridVisible, gridColor: DEFAULT_STATE.gridColor,
      gridOpacity: DEFAULT_STATE.gridOpacity, gridSize: DEFAULT_STATE.gridSize,
      groundVisible: DEFAULT_STATE.groundVisible, groundColor: DEFAULT_STATE.groundColor,
      groundOpacity: DEFAULT_STATE.groundOpacity,
    });
    state.layers = { ...DEFAULT_STATE.layers };
    state.filterIntensityByFilter = { none: 1.0, gray: 1.0, invert: 1.0, sepia: 1.0, contrast: 1.0, sharpen: 1.0, emboss: 1.0, edge: 1.0, custom: 1.0 };
    strengthBadge.textContent = state.strength.toFixed(1);
    blurBadge.textContent = state.blur;
    nscaleBadge.textContent = state.nscale.toFixed(1);
    material.normalScale.set(state.nscale, state.nscale);
    materialPlane.normalScale.set(state.nscale, state.nscale);
    customMeshMaterials.forEach(cm => { if (cm) cm.normalScale.set(state.nscale, state.nscale); });
    applyLightMultiplier(state.lightMul);
    updateKeyLightFromAngles(state.elev, state.azim);
    setLightPreset(state.lightPreset);
    applyBackgroundForCurrent();
    applyGridAndGround();
    applyMaterialPreset(state.currentMaterial);
    applyLayerState();
    if (state.originalCanvas) applyCurrentFilterToSource();
    switchMesh('plane', true);
    if (state.projection !== 'perspective') switchProjection('perspective', true);
    autoFitCamera(state.currentMeshType);
    setZoomPercent(state.projection === 'flat' ? 25 : 50);
    updateCoordsInputs(); updateResetBtnVisibility();
    renderSideSlotIcons(); updateProjRow(); updateEnabledState();
    closeActivePopover();
    if (state.originalCanvas) scheduleRegenerate();
    invalidatePreviewCache(); pushHistory();
    showToast(LANG.t('toastReset'));
  } catch (e) { console.error(e); showToast(LANG.t('toastError'), true); }
}
undoBtn.addEventListener('click', doUndo);
redoBtn.addEventListener('click', doRedo);
function doUndo() {
  try { if (!history.canUndo()) return; const snap = history.undo(); if (snap) { applySnapshot(snap); showToast(LANG.t('toastUndo')); } }
  catch (e) { console.error(e); showToast(LANG.t('toastError'), true); }
}
function doRedo() {
  try { if (!history.canRedo()) return; const snap = history.redo(); if (snap) { applySnapshot(snap); showToast(LANG.t('toastRedo')); } }
  catch (e) { console.error(e); showToast(LANG.t('toastError'), true); }
}

let isSwitchingProjection = false;
function switchProjection(mode, fromHistory) {
  if (isSwitchingProjection) return;
  if (state.projection === mode && fromHistory) return;
  isSwitchingProjection = true;
  try {
    state.projection = mode;
    const oldPos = activeCamera.position.clone();
    const oldTarget = controls.target.clone();
    if (mode === 'flat') {
      activeCamera = flatCam;
      if (controls) controls.dispose();
      controlsBound = false;
      controls = new OrbitControls(flatCam, renderer.domElement);
      controls.enabled = false; controls.target.set(0, 0, 0);
      coordX.disabled = coordY.disabled = coordZ.disabled = true;
      gizmoEl.classList.remove('disabled');
      flatCam.position.set(0, 0, 6); flatCam.lookAt(0, 0, 0);
      state.flatZoomHalfH = 4 - 0.25 * 3.5;
      updateFlatFrustum();
      setZoomPercent(25);
    } else {
      coordX.disabled = coordY.disabled = coordZ.disabled = false;
      gizmoEl.classList.remove('disabled');
      if (mode === 'orthographic') {
        activeCamera = orthoCam;
        orthoCam.position.copy(oldPos); orthoCam.up.copy(camera.up); orthoCam.lookAt(oldTarget);
        updateOrthoFrustum();
      } else {
        activeCamera = camera;
        camera.position.copy(oldPos); camera.lookAt(oldTarget);
      }
      if (controls) controls.dispose();
      controlsBound = false;
      controls = createControls(activeCamera);
      controls.target.copy(oldTarget);
      bindControlsEvents(); controls.update();
      setZoomPercent(50);
    }
    applyBackgroundForCurrent();
    applyGridAndGround();
    updateZoomFromCamera(); updateCoordsInputs(); updateProjRow(); resize(); invalidatePreviewCache();
  } catch (e) { console.error(e); }
  finally { isSwitchingProjection = false; }
}
function updateOrthoFrustum() {
  const dist = orthoCam.position.distanceTo(controls.target);
  const fov = THREE.MathUtils.degToRad(45);
  const aspect = viewport.clientWidth / viewport.clientHeight || 1;
  const halfH = dist * Math.tan(fov / 2); const halfW = halfH * aspect;
  orthoCam.left = -halfW; orthoCam.right = halfW; orthoCam.top = halfH; orthoCam.bottom = -halfH;
  orthoCam.near = 0.1; orthoCam.far = 200; orthoCam.updateProjectionMatrix();
}
function updateFlatFrustum() {
  const aspect = viewport.clientWidth / viewport.clientHeight || 1;
  const halfH = state.flatZoomHalfH; const halfW = halfH * aspect;
  flatCam.left = -halfW; flatCam.right = halfW; flatCam.top = halfH; flatCam.bottom = -halfH;
  flatCam.near = 0.1; flatCam.far = 200; flatCam.updateProjectionMatrix();
}

function setLightPreset(name) {
  state.lightPreset = name;
  if (name === 'studio') {
    keyLight.color.set(0xffffff); fillLight.color.set(0xaaccff); rimLight.color.set(0xffddaa);
    hemi.color.set(0xffffff); hemi.groundColor.set(0x8899aa); presetToneExposure = 1.05;
  } else if (name === 'sunset') {
    keyLight.color.set(0xffaa66); fillLight.color.set(0xff8866); rimLight.color.set(0xffcc88);
    hemi.color.set(0xffbb88); hemi.groundColor.set(0x663322); presetToneExposure = 1.15;
  } else {
    keyLight.color.set(0xcce0ff); fillLight.color.set(0x6699ff); rimLight.color.set(0xaaddff);
    hemi.color.set(0xddeeff); hemi.groundColor.set(0x445566); presetToneExposure = 1.0;
  }
  renderer.toneMappingExposure = presetToneExposure * Math.min(1.5, Math.max(0.5, state.lightMul));
  updateKeyLightFromAngles(state.elev, state.azim);
}
function applyLightMultiplier(mul) {
  ambient.intensity = lightBases.ambient * mul;
  hemi.intensity = lightBases.hemi * mul;
  keyLight.intensity = lightBases.key * mul;
  fillLight.intensity = lightBases.fill * mul;
  rimLight.intensity = lightBases.rim * mul;
  renderer.toneMappingExposure = presetToneExposure * Math.min(1.5, Math.max(0.5, mul));
}
function applyThemeScene() {
  const isLight = THEME.isLight();
  if (isLight) {
    studioFloor.material.color.set(0xe8eaf0);
    studioWall.material.color.set(0xf0f2f6);
  } else {
    studioFloor.material.color.set(0x14141c);
    studioWall.material.color.set(0x1a1a24);
  }
  studioFloor.material.needsUpdate = true;
  studioWall.material.needsUpdate = true;
}

/* ---------- Background presets + color tint ---------- */
const BG_PRESET_COLORS = {
  light:  { r: 232, g: 236, b: 242 },
  dark:   { r: 15,  g: 16,  b: 22  },
  studio: { r: 237, g: 237, b: 237 },
  sunset: { r: 255, g: 200, b: 144 },
  clouds: { r: 200, g: 216, b: 232 },
  ocean:  { r: 13,  g: 58,  b: 92  },
  forest: { r: 26,  g: 51,  b: 36  },
  night:  { r: 10,  g: 15,  b: 30  },
};
function applyTintToRGB(r, g, b, tint) {
  let rr = r, gg = g, bb = b;
  const bright = tint.brightness / 100;
  if (bright !== 1) { rr *= bright; gg *= bright; bb *= bright; }
  const sat = tint.saturation / 100;
  if (sat !== 1) {
    const lum = 0.299 * rr + 0.587 * gg + 0.114 * bb;
    rr = lum + (rr - lum) * sat; gg = lum + (gg - lum) * sat; bb = lum + (bb - lum) * sat;
  }
  const hueDeg = tint.hue;
  if (hueDeg !== 0) {
    const cosH = Math.cos(hueDeg * Math.PI / 180); const sinH = Math.sin(hueDeg * Math.PI / 180);
    const lum = 0.299 * rr + 0.587 * gg + 0.114 * bb;
    const r0 = rr - lum, g0 = gg - lum, b0 = bb - lum;
    rr = lum + r0 * cosH - g0 * sinH; gg = lum + r0 * sinH + g0 * cosH; bb = lum + b0;
  }
  return { r: Math.max(0, Math.min(255, Math.round(rr))), g: Math.max(0, Math.min(255, Math.round(gg))), b: Math.max(0, Math.min(255, Math.round(bb))) };
}
const _sceneBgColor = new THREE.Color();

/* v1.0 fix: цвет bgColor теперь реально влияет на фон. */
function applyBackgroundForCurrent() {
  try {
    const isLight = THEME.isLight();
    let mode = state.currentBgMode;
    const validBgs = isLight ? LIGHT_THEME_BGS : DARK_THEME_BGS;
    if (mode !== 'custom' && mode !== 'color' && !validBgs.includes(mode)) {
      mode = isLight ? 'light' : 'dark';
      state.currentBgMode = mode;
    }
    const isFlat = state.projection === 'flat';
    let baseColor;
    if (mode === 'custom' && state.customBgTexture) {
      scene.background = state.customBgTexture;
      scene.backgroundIntensity = state.bgTint.brightness / 100;
      applyThemeScene();
      return;
    }
    if (mode === 'color') baseColor = state.bgColor;
    else baseColor = BG_PRESET_COLORS[mode] || BG_PRESET_COLORS[isLight ? 'light' : 'dark'];
    // Применяем пользовательский цвет поверх пресета — так R/G/B работают в любом режиме,
    // включая пресеты. Если цвет не меняли (равен базовому пресету), получим тот же цвет.
    const userColorActive = state.bgColor &&
      (mode === 'color' ||
       state.bgColor.r !== baseColor.r ||
       state.bgColor.g !== baseColor.g ||
       state.bgColor.b !== baseColor.b);
    const effectiveColor = userColorActive
      ? { r: Math.round((baseColor.r + state.bgColor.r) / 2),
          g: Math.round((baseColor.g + state.bgColor.g) / 2),
          b: Math.round((baseColor.b + state.bgColor.b) / 2) }
      : baseColor;
    const tinted = applyTintToRGB(effectiveColor.r, effectiveColor.g, effectiveColor.b, state.bgTint);
    _sceneBgColor.setRGB(tinted.r / 255, tinted.g / 255, tinted.b / 255);
    scene.background = _sceneBgColor;
    applyThemeScene();
    if (isFlat) {
      studioFloor.visible = false; studioWall.visible = false;
      scene.environmentIntensity = 0.45;
    } else if (mode === 'studio') {
      studioFloor.visible = state.groundVisible; studioWall.visible = true;
      scene.environmentIntensity = 1.0;
    } else {
      studioFloor.visible = false; studioWall.visible = false;
      scene.environmentIntensity = (mode === 'light' || mode === 'clouds') ? 0.55 : 0.45;
    }
    if (state.currentMaterial === 'default') {
      const col = isLight ? 0xffffff : 0xdddddd;
      material.color.setHex(col); materialPlane.color.setHex(col);
      customMeshMaterials.forEach(cm => { if (cm && cm.color) cm.color.setHex(col); });
    }
  } catch (e) { console.error(e); }
}

/* v1.0 fix: режим "studio" больше не отключает сетку и подложку. */
function applyGridAndGround() {
  try {
    const isFlat = state.projection === 'flat';
    if (isFlat) {
      gridHelper.visible = false;
      ground.visible = false;
      studioFloor.visible = false;
      studioWall.visible = false;
      return;
    }
    const divisions = Math.max(1, Math.round(state.gridSize));
    if (gridHelper.userData._size !== state.gridSize) {
      scene.remove(gridHelper);
      if (gridHelper.geometry) gridHelper.geometry.dispose();
      if (gridHelper.material) gridHelper.material.dispose();
      gridHelper = new THREE.GridHelper(state.gridSize, divisions, state.gridColor, state.gridColor);
      gridHelper.position.y = -1.79;
      gridHelper.userData._size = state.gridSize;
      gridHelper.userData._color = state.gridColor;
      scene.add(gridHelper);
    } else if (gridHelper.userData._color !== state.gridColor) {
      gridHelper.material.color.setHex(state.gridColor);
      gridHelper.userData._color = state.gridColor;
      gridHelper.material.needsUpdate = true;
    }
    gridHelper.material.opacity = state.gridOpacity;
    gridHelper.material.transparent = true;
    gridHelper.material.needsUpdate = true;

    groundMat.color.setHex(state.groundColor);
    groundMat.opacity = state.groundOpacity;
    groundMat.transparent = state.groundOpacity < 1;
    groundMat.needsUpdate = true;

    // Пользователь управляет сеткой/подложкой через чекбоксы — никакой режим
    // фона больше не переопределяет эти флаги.
    gridHelper.visible = state.gridVisible;
    ground.visible = state.groundVisible;
    studioFloor.visible = state.currentBgMode === 'studio' && state.groundVisible;
    studioWall.visible = state.currentBgMode === 'studio';
    if (state.currentBgMode === 'studio' && state.groundVisible) {
      // В студии показываем studioFloor как пол вместо простого ground —
      // но обе плоскости могут сосуществовать без конфликта. ground спрятан.
      ground.visible = false;
    }
  } catch (e) { console.error('applyGridAndGround:', e); }
}

function switchMesh(type, force) {
  try {
    if (type === 'custom') {
      if (customMesh) {
        if (currentMesh && currentMesh !== customMesh) scene.remove(currentMesh);
        currentMesh = customMesh;
        if (!customMesh.parent) scene.add(customMesh);
        state.currentMeshType = 'custom';
        autoFitCamera('custom');
        setZoomPercent(state.projection === 'flat' ? 25 : 50);
        updateCoordsInputs();
      } else if (!force) return;
      return;
    }
    if (currentMesh) scene.remove(currentMesh);
    if (customMesh && customMesh.parent) scene.remove(customMesh);
    currentMesh = SHAPE_MESHES[type];
    if (currentMesh) {
      scene.add(currentMesh);
      state.currentMeshType = type;
      autoFitCamera(type);
      setZoomPercent(state.projection === 'flat' ? 25 : 50);
      updateCoordsInputs();
    }
  } catch (e) { console.error(e); }
}
function autoFitCamera(type) {
  if (!viewport.clientWidth || !viewport.clientHeight) return;
  try {
    let radius = 1;
    if (type === 'custom' && customMesh) {
      const box = new THREE.Box3().setFromObject(customMesh);
      const size = new THREE.Vector3(); box.getSize(size);
      radius = Math.max(size.x, size.y, size.z) / 2 || 1;
    } else if (currentMesh && currentMesh.geometry) {
      currentMesh.geometry.computeBoundingSphere();
      radius = currentMesh.geometry.boundingSphere.radius || 1;
    }
    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const aspect = viewport.clientWidth / viewport.clientHeight || 1;
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
    const fov = Math.min(vFov, hFov);
    const margin = 2.6;
    const dist = (radius / Math.sin(fov / 2)) * margin;
    let pos;
    if (type === 'plane') pos = new THREE.Vector3(0, radius * 0.03, dist);
    else if (type === 'cube') pos = new THREE.Vector3(dist * 0.55, dist * 0.45, dist * 0.75);
    else if (type === 'custom') pos = new THREE.Vector3(dist * 0.4, dist * 0.35, dist * 0.8);
    else pos = new THREE.Vector3(0, radius * 0.15, dist);
    camera.position.copy(pos); orthoCam.position.copy(pos);
    if (state.projection !== 'flat' && controls) controls.target.set(0, 0, 0);
    if (activeCamera.isOrthographicCamera) updateOrthoFrustum();
    if (controls) controls.update();
  } catch (e) { console.error(e); }
}

function applyLanguage(lang) {
  try {
    LANG.current = lang;
    document.documentElement.lang = lang;
    saveLang(lang);
    const t = (key) => LANG.t(key);
    const setText = (id, val) => { const el = $(id); if (el && el.tagName !== 'A') el.textContent = val; };
    const brandLink = $('brandSubLink');
    if (brandLink) brandLink.textContent = t('author');
    setText('posLabel', t('posLabel'));
    setText('resetCamBtn', t('posReset'));
    setText('layersLabel', t('layers'));
    const sh = $('swipeHint');
    if (sh) sh.innerHTML = `<i class="bi bi-arrows-move"></i> ${t('swipeHint')}`;
    invalidatePreviewCache();
    renderLayers(); renderSideSlotIcons(); updateProjRow(); updateEnabledState();
    if (SHEET.overlay && SHEET.overlay.classList.contains('show') && SHEET.currentKey) {
      const titleMap = {
        'settings': 'settings', 'help': 'helpTitle', 'tile': 'tileTitle',
        'legal-privacy': 'privacyTitle', 'legal-terms': 'termsTitle',
        'cookies': 'noticeCookiesTitle', 'confirm': 'confirmTitle',
      };
      const titleKey = titleMap[SHEET.currentKey];
      if (titleKey && SHEET.title) {
        const span = SHEET.title.querySelector('span');
        if (span) span.textContent = LANG.t(titleKey);
      }
      if (SHEET.currentKey === 'settings') { SHEET.body.innerHTML = buildSettingsBodyHtml(); bindSettingsBody(SHEET.body); }
      else if (SHEET.currentKey === 'help') SHEET.body.innerHTML = buildHelpBody();
      else if (SHEET.currentKey === 'tile') { closeSheet(); setTimeout(() => openTileSheet(), 120); return; }
      else if (SHEET.currentKey === 'legal-privacy') { closeSheet(); setTimeout(() => openLegalPrivacyStep(), 120); return; }
      else if (SHEET.currentKey === 'legal-terms') { closeSheet(); setTimeout(() => openLegalTermsStep(), 120); return; }
      else if (SHEET.currentKey === 'cookies') { closeSheet(); setTimeout(() => openCookiesSheet(), 120); return; }
      else if (SHEET.currentKey === 'confirm') { closeSheet(); setTimeout(() => openConfirmSheet(), 120); return; }
    }
    if (activeTool && activeAnchorBtn) {
      const btn = activeAnchorBtn;
      closeActivePopover();
      openPopoverFor(btn);
    }
  } catch (e) { console.error('applyLanguage:', e); }
}

let animEnabled = true;
let rafId = null;
function animate() {
  rafId = null;
  if (!animEnabled) return;
  try {
    controls.update();
    renderer.render(scene, activeCamera);
    renderGizmo();
    updateStats();
  } catch (e) { console.error('render loop error', e); }
  rafId = requestAnimationFrame(animate);
}
document.addEventListener('visibilitychange', () => {
  animEnabled = !document.hidden;
  if (animEnabled && rafId === null) { fpsTimer = performance.now(); frameCount = 0; animate(); }
  if (!animEnabled && rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
});

function boot() {
  try {
    if (!initSheet()) { console.error('Sheet init failed'); showToast('UI init failed', true); return; }
    const initialLang = detectLang();
    THEME.apply('system');
    applyThemeScene();
    applyLanguage(initialLang);
    renderSideSlotIcons(); updateProjRow();
    resize();
    autoFitCamera('plane');
    setZoomPercent(50);
    updateKeyLightFromAngles(35, 45);
    updateCoordsInputs(); updateResetBtnVisibility();
    renderLayers(); updateEnabledState(); updateHistoryButtons(); updateLayersAnchor();
    applyGridAndGround();

    if (window.ResizeObserver) {
      try { const ro = new ResizeObserver(() => updateLayersAnchor()); ro.observe(layersContainer); } catch (e) {}
    }
    try {
      const seed = getSampleSeed();
      const starterCanvas = buildRandomStartupTexture(256, seed);
      state.isSampleTexture = true;
      processSourceCanvas(starterCanvas);
    } catch (e) { console.warn('Starter texture failed:', e); }

    settingsBtn.addEventListener('click', openSettingsSheet);
    helpBtn.addEventListener('click', openHelpSheet);
    tileSideBtn.addEventListener('click', (e) => { e.stopPropagation(); openTileSheet(); });
    resetAllBtn.addEventListener('click', openConfirmSheet);

    document.addEventListener('keydown', (e) => {
      if (SHEET.overlay && SHEET.overlay.classList.contains('show') && SHEET.closeLocked) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); }
        return;
      }
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') { if (e.key === 'Escape') e.target.blur(); return; }
      const meta = e.ctrlKey || e.metaKey;
      if (meta && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) { e.preventDefault(); doUndo(); }
      else if (meta && ((e.key === 'y' || e.key === 'Y') || ((e.key === 'z' || e.key === 'Z') && e.shiftKey))) { e.preventDefault(); doRedo(); }
      else if (e.key === 'Escape') {
        if (layerZoomOverlay.classList.contains('show')) closeLayerZoom();
        else if (activeTool) closeActivePopover();
        else if (SHEET.overlay && SHEET.overlay.classList.contains('show') && !SHEET.closeLocked) closeSheet();
      }
    });

    if (!hasAck(STORAGE_KEYS.legalAck)) { SHEET.legalGate = true; setTimeout(() => openLegalPrivacyStep(), 500); }
    else if (!hasAck(STORAGE_KEYS.cookiesAck)) { SHEET.legalGate = true; setTimeout(() => openCookiesSheet(), 600); }

    setTimeout(() => {
      const gw = gizmoEl.clientWidth || 54;
      gizmoRenderer.setSize(gw, gw);
      updateZoomThumbPosition(getZoomPercent());
      updateLayersAnchor();
    }, 100);

    animate();
  } catch (e) { console.error('Boot error:', e); showToast('Boot error', true); }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
